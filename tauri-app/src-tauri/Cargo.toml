[package]
name = "awen-editor"
version = "1.21.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# aine 解释器进程内嵌(rlib 阶段 a):消灭 spawn/闪窗/行协议;
# 本机 path 依赖,发布可切 git 依赖
aine = { path = "E:/个人项目/Flow/flowc" }
libloading = "0.8"
