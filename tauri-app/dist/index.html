<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awen</title>
<script src="engine.js"></script>
<script src="bridge.js"></script>
<style>
:root{--serif:Georgia,"Times New Roman","Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;--sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;--mono:"Cascadia Code","Consolas",monospace;--bg:#e8e9eb;--bg2:#fafafa;--bg3:#f7f7f8;--border:#dedfe2;--border2:#d9dade;--fg2:#6b6d72;--accent:#4b6f8d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:#24262a;font-size:14px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
select{font:inherit;border:1px solid #c9cbce;border-radius:4px;background:#fff;padding:4px 5px;font-size:12px;color:#303238;outline:none;cursor:pointer;max-width:110px}
input[type=color]{width:26px;height:24px;border:1px solid #c9cbce;border-radius:4px;background:#fff;padding:1px;cursor:pointer}
input.findbox{border:1px solid #c9cbce;border-radius:4px;padding:4px 6px;font-size:12px;outline:none;width:110px}
.app{height:100vh;display:flex;flex-direction:column}
.titlebar{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px;flex:none;user-select:none}
.brand{font-weight:700;font-size:15px;color:#1a1c1f}
.docname{font-size:13px;color:var(--fg2)}
/* ── Word/WPS 功能区:标签栏 + 紧凑图标网格 + 分组名 ── */
.filetabs{display:flex;align-items:center;gap:2px;flex:none;overflow-x:auto;height:28px}
.ftab{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px 0 12px;border-radius:5px;font-size:12px;color:#5a5c60;cursor:pointer;flex:none;border:1px solid transparent}
.ftab:hover{background:#e9eaec}
.ftab.active{background:#fff;color:#1a1c1f;font-weight:600;border-color:var(--border)}
.ftab .fdirty{width:7px;height:7px;border-radius:50%;background:#c0392b;display:none}
.ftab.dirty .fdirty{display:inline-block}
.ftab .fclose{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:#8a8c90;font-size:11px}
.ftab .fclose:hover{background:#dcdde0;color:#303238}
.tabbar{height:32px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:2px;flex:none;user-select:none}
.tab{font-size:13px;color:#5a5c60;padding:5px 16px;border-radius:5px;cursor:pointer}
.tab:hover{background:#e9eaec}
.tab.active{background:#fff;color:#1a1c1f;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--border)}
.tabbar .view-tabs{margin-left:auto;display:flex;background:#e9eaec;padding:2px;border-radius:6px;gap:1px}
.view-tabs button{font-size:12px;padding:4px 14px;border-radius:5px;color:#6b6d72}
.view-tabs button.active{background:#fff;color:#222;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ribbon{background:var(--bg3);border-bottom:1px solid var(--border2);flex:none;user-select:none}
.ribbon-page{display:none;align-items:stretch;padding:5px 16px 0;min-height:96px;height:96px}
.ribbon-page.active{display:flex}
.rgroup{display:flex;flex-direction:column;padding:0 18px;border-right:1px solid #e0e1e4;flex:none;justify-content:center}
.rgroup:last-child{border-right:0}
.rg-body{display:flex;gap:10px;align-items:center}
.rg-label{font-size:10px;color:#8a8c90;text-align:center;padding:4px 2px 6px;line-height:1;white-space:nowrap}
.rbtn{width:34px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#303238;flex:none}
.rbtn:hover{background:#e6e7e9}
.rbtn:active{background:#dcdde0}
.rbtn svg{width:19px;height:19px;display:block}
.rbtn.b{font-weight:700;font-size:16px}.rbtn.i{font-style:italic;font-family:Georgia,serif;font-size:16px}
.rbtn.u span,.rbtn.s span{font-size:16px}
.rbtn.mono{font-family:var(--mono);font-size:12px;font-weight:600}
.rbtn.supb span,.rbtn.subb span{font-size:14px}
.rbtn.supb span{vertical-align:super}.rbtn.subb span{vertical-align:sub}
.rgrid{display:grid;grid-template-columns:repeat(5,34px);gap:3px}
.rgrid3{display:grid;grid-template-columns:repeat(4,34px);gap:3px}
.rgrid4{display:grid;grid-template-columns:repeat(4,34px);gap:3px}
.fcol{display:flex;flex-direction:column;gap:4px}
.frow{display:flex;gap:4px;align-items:center}
.frow select{height:28px;font-size:12px;padding:2px 6px}
.frow #sel-style{width:100px}
.frow #sel-font{width:130px}
.frow #sel-size{width:78px}
.vsel{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 2px}
.vsel select{height:26px;padding:2px 5px;font-size:12px}
.vsel #sel-font{width:126px}
.vsel #sel-size{width:80px}
.findbox,.replacebox{border:1px solid #c9cbce;border-radius:4px;padding:5px 7px;font-size:12px;outline:none;width:130px}
.tbtn{height:30px;padding:0 10px;gap:5px;display:flex;align-items:center;border-radius:4px;color:#303238;flex:none;font-size:12px;cursor:pointer}
.tbtn:hover{background:#e6e7e9}
.tbtn svg{width:16px;height:16px;display:block}
.sbtn{height:28px;padding:0 10px;border:1px solid #c9cbce;border-radius:4px;background:#fff;font-size:12px;color:#303238;flex:none;cursor:pointer}
.sbtn:hover{background:#f0f1f2}
.colordrop{position:relative;display:flex;flex:none}
.colordrop .caret{width:13px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:9px;color:#5a5c60}
.colordrop .caret:hover{background:#e6e7e9}
.cpalette{display:none;position:absolute;top:36px;left:0;z-index:50;background:#fff;border:1px solid #c9cbce;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:12px;width:auto}
.cpalette .cp-grid{display:grid;grid-template-columns:repeat(10,22px);gap:4px}
.cpalette .sw{width:22px;height:22px;border-radius:3px;border:1px solid rgba(0,0,0,.12);cursor:pointer}
.cpalette.open{display:block}
.cpalette .cp-title{font-size:11px;color:#6b6d72;margin:2px 0 5px}

.cpalette .sw:hover{outline:2px solid var(--accent);outline-offset:1px}
.cpalette .cp-more{margin-top:8px;font-size:12px;color:#2a4a66;cursor:pointer;display:flex;align-items:center;gap:5px}
.cpalette .cp-more:hover{text-decoration:underline}
/* ── 复合颜色按钮(Word 式一体化)── */
.splitbtn{display:flex;border:1px solid #d0d2d5;border-radius:4px;background:#fff;overflow:hidden}
.splitbtn .rbtn{border-radius:0;width:26px;border-right:1px solid #e3e4e6}
.splitbtn .half-caret{width:14px;height:30px;font-size:10px;color:#303238;display:flex;align-items:center;justify-content:center;border-radius:0;font-family:Consolas,monospace;font-weight:700}
.splitbtn .half-caret:hover,.splitbtn .rbtn:hover{background:#e9eaec}
/* ── 撤销/重做禁用态 ── */
.rbtn:disabled{opacity:.32;pointer-events:none}
/* ── 文档名输入 ── */
input.docname{background:transparent;border:1px solid transparent;border-radius:4px;padding:2px 8px;font-size:13px;color:#24262a;width:200px;font-family:var(--sans)}
input.docname:hover{border-color:#d5d7da}
input.docname:focus{outline:none;border-color:var(--accent);background:#fff}
/* ── 浮动迷你工具栏 ── */
#minibar{position:fixed;display:none;flex-direction:column;gap:2px;background:#fff;border:1px solid #c9cbce;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.2);padding:4px;z-index:120}
#minibar .rbtn{width:28px;height:28px}
#minibar .mb-row{display:flex;gap:2px}
#minibar .sep{width:1px;background:#e0e1e4;margin:2px 3px}
#minibar .sbtn{height:24px;padding:0 6px;font-size:11px}
/* ── 大纲当前节高亮 ── */
.outline-item.active{background:#d7e2ec;color:#2a4a66;font-weight:600}
/* ── 表格行列选择弹层 ── */
#tblpop{display:none;position:fixed;z-index:130;background:#fff;border:1px solid #c9cbce;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:10px;gap:6px;align-items:center}
#tblpop input{width:44px;height:24px;border:1px solid #c9cbce;border-radius:4px;padding:2px 4px;font-size:12px}
#tblpop .lbl{font-size:12px;color:#5a5c60}
/* ── 查找全部高亮 ── */
::highlight(findhit){background:#ffe98a;color:#303238}
/* ── 诊断弹出面板 ── */
.statuspop{display:none;position:fixed;bottom:32px;left:10px;z-index:110;background:#fff;border:1px solid #c9cbce;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.16);padding:8px 12px;max-width:460px;max-height:220px;overflow:auto;font-size:12px;color:#303238}
.statuspop .dline{padding:3px 0;border-bottom:1px solid #f0f1f2;cursor:pointer}
.statuspop .dline:hover{background:#f7f7f8}
.diag-err{color:#c0392b;font-weight:600}
.diag-warn{color:#8a6d1a;font-weight:600}
@media print{.tabbar,.ribbon,.sidebar,.statusbar,.titlebar{display:none!important}.app{height:auto}.workspace{overflow:visible;display:block}.pane{overflow:visible;padding:0;background:#fff;gap:0}.sheet{box-shadow:none;page-break-after:always;min-height:auto}}
.workspace{min-height:0;flex:1;display:flex;overflow:hidden}
.sidebar{width:180px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none;overflow:hidden;transition:margin-left .18s ease}
.sidebar.collapsed{margin-left:-180px}
.side-head{position:relative}
#sb-close{position:absolute;right:6px;top:9px;width:22px;height:20px;border:none;background:none;cursor:pointer;color:#8a8c90;border-radius:4px;font-size:11px}
#sb-close:hover{background:#ececee;color:#303238}
#sb-open{display:none;width:22px;height:28px;border:none;background:none;cursor:pointer;color:#8a8c90;font-size:13px;flex:none}
#sb-open:hover{color:#303238}
.side-head{padding:12px 14px 6px;font-size:12px;font-weight:600;color:#74777c;user-select:none}
.outline{flex:1;overflow-y:auto;padding:2px 8px}
.outline-item{padding:5px 8px;border-radius:6px;font-size:12px;color:#5d6066;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.outline-item:hover{background:#ececee;color:#2d3035}
.outline-item.lv1{font-weight:600;color:#2d3035}
.outline-item.lv2{padding-left:18px}
.outline-item.lv3{padding-left:30px}
.outline-item.lv4{padding-left:42px}
.pane{min-width:0;flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:24px 0 80px;gap:16px}
.sheet{width:210mm;min-height:297mm;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.08);padding:20mm;position:relative;flex:none}
.sheet .folio{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:9pt;color:#b5b7bb;font-family:var(--sans)}
.paper{font-family:var(--serif);font-size:11pt;line-height:1.9;color:#303238;line-break:strict;outline:none}
.paper [data-bid]:empty::after{content:'¶';color:#ccc;font-size:10pt}
.paper [data-bid]{position:relative;min-height:1em}
.paper [data-bid]:focus-within{background:rgba(75,111,141,.04)}
.paper .gap{height:0.55em}
.paper h1{font-size:22pt;line-height:1.4;font-weight:700;color:#1a1c1f}
.paper h2{font-size:15pt;font-weight:700;color:#2a2c30}
.paper h3{font-size:13pt;font-weight:650;color:#2d3035}
.paper h4{font-size:12pt;font-weight:600}
.paper h5{font-size:11pt;font-weight:600}
.paper h6{font-size:10.5pt;font-weight:600;color:#888}
.paper p{margin:0}
.paper strong,.paper b{font-weight:700}
.paper em,.paper i{font-style:italic}
.paper del,.paper s,.paper strike{text-decoration:line-through;color:#999}
.paper u{text-decoration:underline}
.paper code{font-family:var(--mono);font-size:.87em;background:#f0f1f2;padding:1px 4px;border-radius:3px}
.paper hr{border:none;border-top:1px solid #ccc;margin:.8em 0}
.paper blockquote{border-left:3px solid #c8cad0;padding:2px 14px;color:#5a5c60;font-size:.95em}
.paper ul,.paper ol{margin:0;padding-left:2.4em}
.paper table{width:100%;border-collapse:collapse;font-size:10.5pt}
.paper table th,.paper table td{border:1px solid #d0d2d5;padding:4px 8px;text-align:left;vertical-align:top}
.paper table th{font-weight:600;background:#f5f5f6}
.paper .img-ph{width:100%;height:32mm;background:#f0f1f3;border:1px dashed #c5c7ca;display:flex;align-items:center;justify-content:center;color:#999;font-size:10pt}
.paper img{max-width:100%;display:block}
.paper .docset{font-family:var(--mono);font-size:8pt;color:#c8cad0;user-select:none}
.paper .comment-src{background:#fffbe8;color:#b09a3e;font-family:var(--mono);font-size:9pt;border-radius:3px;padding:0 4px}
.paper .inline-label{background:#eef4f8;color:#2a4a66;font-size:.85em;border-radius:3px;padding:0 4px}
.paper .inline-ref{color:#2a4a66}
.paper table{table-layout:fixed}
.paper table td{overflow-wrap:break-word}
.paper [data-kind="scope"]{border-left:2px solid #b9c8d6;padding-left:8px}
.statusbar{height:26px;background:var(--bg3);border-top:1px solid var(--border2);color:#5a5c60;display:flex;align-items:center;padding:0 14px;font-size:12px;gap:16px;flex:none}
.statusbar .item{white-space:nowrap}
.statusbar #st-diag{cursor:pointer}
.statusbar .spacer{flex:1}
.src-wrap{display:flex;height:100%;overflow:hidden;flex:1}
.gutter{width:46px;flex:none;overflow:hidden;text-align:right;padding:0 6px 0 2px;color:#9aa0a6;font-size:10.5pt;line-height:1.8;background:var(--bg2);border-right:1px solid #e3e4e6;user-select:none;white-space:pre}
.gutter .ln.cur{color:#2a4a66;font-weight:700;background:#e8eef4}
.splitter{width:7px;flex:none;cursor:col-resize;background:var(--bg2);border-left:1px solid var(--border2);border-right:1px solid var(--border2)}
.splitter:hover{background:#d7e2ec}
.findbar-pop{display:none;position:fixed;top:120px;right:24px;z-index:150;width:340px;background:#fff;border:1px solid #c9cbce;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);overflow:hidden}
.findbar-pop .fb-head{height:34px;background:var(--bg3);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#3d3f43}
.findbar-pop .fb-head .x{margin-left:auto;cursor:pointer;color:#8a8c90;padding:0 4px}
.findbar-pop .fb-body{padding:10px 12px}
.findbar-pop .fb-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.findbar-pop input[type=text]{flex:1;border:1px solid #c9cbce;border-radius:4px;padding:5px 8px;font-size:12px;outline:none}
.findbar-pop label{font-size:12px;color:#5d6066;display:flex;align-items:center;gap:3px;flex:none}

.paper .codeblock{background:#f5f6f7;border:1px solid #e0e1e4;border-radius:4px;padding:8px 12px;position:relative}
.paper .code-lang{font-size:9pt;color:#8a8c90;font-family:var(--sans);position:absolute;top:2px;right:8px}
.paper .codeblock pre{margin:0;font-family:var(--mono);font-size:10pt;line-height:1.6;color:#303238;white-space:pre-wrap;word-break:break-all}
.paper .mathblock{border:1px solid #d7e2ec;border-radius:4px;padding:8px 12px;background:#f8fafc;position:relative}
.paper .math-label{font-size:9pt;color:#8a8c90;font-family:var(--sans);position:absolute;top:2px;right:8px}
.paper .math-content{font-family:Georgia,serif;font-style:italic;font-size:12pt;color:#2a4a66}
.paper .lblref-block{background:#eef4f8;color:#2a4a66;font-size:9pt;font-family:var(--sans);border-radius:3px;padding:2px 8px;display:inline-block}
.paper .ref-block{background:#f0f4f0;color:#3a6a3a;font-size:9pt;font-family:var(--sans);border-radius:3px;padding:2px 8px;display:inline-block}
</style>
</head>
<body>
<div class="app">
<div class="titlebar">
<div class="brand">Awen</div>
<input class="docname" id="docname" value="未命名文档" title="点击修改文档名"><span id="dirty-mark" style="font-size:11px;color:#c0392b;display:none">未保存</span>
<div style="margin-left:auto"><button class="rbtn" style="width:auto;padding:0 8px;gap:4px;font-size:12px" onclick="doSave()" title="保存 (Ctrl+S)"><span data-icon="save"></span>保存</button></div>
</div>
<div class="filetabs" id="filetabs"></div>
<div class="tabbar">
<div class="tab active" data-page="home" onclick="showRibbon('home')">开始</div>
<div class="tab" data-page="insert" onclick="showRibbon('insert')">插入</div>
<div class="tab" data-page="page" onclick="showRibbon('page')">页面</div>
<div class="tab" data-page="file" onclick="showRibbon('file')">文件</div>
<button class="rbtn" style="width:28px;height:26px;margin-left:auto;margin-right:8px" onclick="toggleRibbonCollapse()" id="btn-collapse" title="折叠/展开功能区 (Ctrl+F1)"><span style="font-size:12px">▲</span></button>
<div class="view-tabs">
<button class="active" data-mode="display">显示</button>
<button data-mode="syntax">语法</button>
<button data-mode="split">分屏</button>
<button data-mode="swapsplit" title="左右交换" style="padding:4px 8px" onclick="swapSplit()">⇄</button>
</div>
</div>
<div class="ribbon">
<div class="ribbon-page active" data-page="home">
<div class="rgroup"><div class="rg-body">
<button class="rbtn" style="width:38px" onclick="doUndo()" title="撤销 (Ctrl+Z)"><span data-icon="undo"></span></button>
<button class="rbtn" style="width:38px" onclick="doRedo()" title="重做 (Ctrl+Y)"><span data-icon="redo"></span></button>
</div><div class="rg-label">剪贴板</div></div>
<div class="rgroup"><div class="rg-body"><div class="fcol">
<div class="frow">
<select id="sel-style" title="段落样式" onchange="applyStyle(this.value)">
<option value="" selected>正文</option><option value="1">标题 1</option><option value="2">标题 2</option><option value="3">标题 3</option><option value="4">标题 4</option><option value="5">标题 5</option><option value="6">标题 6</option>
</select>
<select id="sel-font" title="字体" onchange="applyFont(this.value)">
<optgroup label="中文"><option value="SimSun" selected>宋体</option><option value="SimHei">黑体</option><option value="KaiTi">楷体</option><option value="FangSong">仿宋</option><option value="Microsoft YaHei">微软雅黑</option><option value="DengXian">等线</option><option value="LiSu">隶书</option><option value="YouYuan">幼圆</option><option value="STZhongsong">华文中宋</option><option value="STXihei">华文细黑</option></optgroup>
<optgroup label="西文"><option value="Times New Roman">Times New Roman</option><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Cambria">Cambria</option><option value="Segoe UI">Segoe UI</option><option value="Courier New">Courier New</option><option value="Consolas">Consolas</option></optgroup>
</select>
<select id="sel-size" title="字号" onchange="applySize(this.value)">
<option value="10.5" selected>五号</option><option value="9">小五</option><option value="11">11 号</option><option value="12">小四</option><option value="14">四号</option><option value="16">三号</option><option value="18">二号</option><option value="22">一号</option>
</select>
</div>
<div class="frow">
<button class="rbtn b" onclick="fmtCmd('bold')" title="加粗 (Ctrl+B)">B</button>
<button class="rbtn i" onclick="fmtCmd('italic')" title="倾斜 (Ctrl+I)">I</button>
<button class="rbtn u" onclick="fmtCmd('underline')" title="下划线 (Ctrl+U)"><span style="text-decoration:underline">U</span></button>
<button class="rbtn s" onclick="fmtCmd('strikeThrough')" title="删除线"><span style="text-decoration:line-through">S</span></button>
<button class="rbtn supb" onclick="fmtCmd('superscript')" title="上标"><span>x²</span></button>
<button class="rbtn subb" onclick="fmtCmd('subscript')" title="下标"><span>x₂</span></button>
<div class="colordrop splitbtn" onclick="togglePal(event,'fore')">
<button class="rbtn"><span data-icon="fontcolor"></span></button>
<button class="half-caret" onclick="togglePal(event,'fore')">▾</button>
</div>
<div class="colordrop splitbtn" onclick="togglePal(event,'mark')">
<button class="rbtn" onclick="applyMark(curMark)" title="底纹高亮:点击应用,箭头选更多颜色"><span data-icon="mark"></span></button>
<button class="half-caret" onclick="togglePal(event,'mark')">▾</button>
</div>

<option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option>

<script>
// ═══ UI 层:工具栏 / 纸面 DOM / 光标 / 撤销 / 查找 / 文件管理 ═══
// 解析·渲染·序列化在 engine.js(AwenEngine),原生引擎桥在 bridge.js(Bridge)。
var Engine=window.AwenEngine;
var Bridge=window.Bridge;
var CFG=Engine.getConfig();

// ═══ 数据通道:generate_preview.aine 将 /*__JSON__*/{} 替换为核心渲染 JSON ═══
var DOC_DATA = /*__JSON__*/{};
var DEFAULT_SRC = '# Awen 迷你编辑器\n\n直接在纸面上打字,回车分段,选中文字用工具栏加粗、变色。\n\n## 断行规则\n\n中西文混排加八分之一 em 间距,英文单词不拆断,行首行尾禁则自动调整,连续标点挤压半宽。\n\n---\n\n> 引用示例\n\n- 列表项一\n- 列表项二\n\n@[table demo]\n| 列1 | 列2 |\n| --- | --- |\n| 内容 | 内容 |\n@[/table]\n';

// ═══ 渲染:每张 A4 纸一个整体可编辑区(原生 Enter/Delete)═══
var gSrc='', gPages=[], gNodes=[];
function render(src){
  gSrc=src;
  gNodes=Engine.parse(src);
  gPages=Engine.layoutPages(gNodes);
  renderNodes();
}
// 用现有 gNodes/gPages 重建纸面 DOM(本地解析与原生权威解析共用出口)
function renderNodes(){
  var pane=document.getElementById('display-pane');
  pane.innerHTML='';
  for(var p=0;p<gPages.length;p++){
    var sheet=document.createElement('div');
    sheet.className='sheet';
    sheet.style.width=CFG.PAGE_W+'mm';
    sheet.style.minHeight=CFG.PAGE_H+'mm';
    sheet.style.padding=CFG.MARGIN+'mm';
    var paper=document.createElement('div');
    paper.className='paper';
    paper.contentEditable='true';
    paper.style.lineHeight=CFG.LINE_H;
    paper.dataset.page=p;
    for(var k=0;k<gPages[p].length;k++){
      var item=gPages[p][k], b=item.b;
      if(b.kind==='docset'){
        var d=document.createElement('div'); d.className='docset'; d.contentEditable='false'; d.textContent=b.text;
        paper.appendChild(d);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='comment'){
        var cm=document.createElement('div'); cm.className='comment-src'; cm.contentEditable='false';
        cm.textContent=b.text; cm.dataset.raw=b.text;
        paper.appendChild(cm);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='code'){
        var pre=document.createElement('div');
        pre.className='codeblock';
        pre.contentEditable='false';
        pre.dataset.bid=b.bid; pre.dataset.kind='code';
        pre.innerHTML='<div class="code-lang">'+Engine.escHtml(b.lang)+'</div><pre><code>'+Engine.escHtml(b.text)+'</code></pre>';
        paper.appendChild(pre);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='math'){
        var mm=document.createElement('div');
        mm.className='mathblock'; mm.contentEditable='false';
        mm.dataset.bid=b.bid; mm.dataset.kind='math';
        mm.innerHTML='<div class="math-label">数学</div><div class="math-content">'+Engine.escHtml(b.text)+'</div>';
        paper.appendChild(mm);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='label'){
        var lb=document.createElement('div'); lb.className='lblref-block';
        lb.contentEditable='false'; lb.dataset.bid=b.bid; lb.dataset.kind='label';
        lb.textContent='📌 标签: '+b.text;
        paper.appendChild(lb);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='ref'){
        var rf=document.createElement('div'); rf.className='ref-block';
        rf.contentEditable='false'; rf.dataset.bid=b.bid; rf.dataset.kind='ref';
        rf.textContent='↦ 引用: '+b.text;
        paper.appendChild(rf);
        paper.appendChild(gapEl()); continue;
      }
      paper.appendChild(makeBlock(b,item));
      paper.appendChild(gapEl());
    }
    var folio=document.createElement('div');
    folio.className='folio'; folio.contentEditable='false'; folio.textContent='— '+(p+1)+' —';
    sheet.appendChild(paper); sheet.appendChild(folio);
    pane.appendChild(sheet);
  }
  renderOutline();
  renderStatus();
  updateGutter();
  var ta=document.getElementById('syntax-src');
  if(ta&&ta.value!==gSrc)ta.value=gSrc;
}
function gapEl(){ var g=document.createElement('div'); g.className='gap'; g.contentEditable='false'; return g }
function makeBlock(b,item){
  var html;
  if(item.whole||item.l0===undefined){
    html=Engine.blockHtml(b);
    var wrap=document.createElement('div');
    wrap.innerHTML=html;
    var inner=wrap.firstElementChild;
    inner.dataset.bid=b.bid;
    inner.dataset.kind=b.kind;
    if(b.kind==='obj')inner.dataset.raw=b.text;
    return inner;
  }
  var text=item.partLines.slice(item.l0,item.l1).join('');
  var el=document.createElement('p');
  el.dataset.bid=b.bid;
  el.dataset.kind='para';
  el.dataset.l0=item.l0; el.dataset.l1=item.l1;
  if(item.l0>0)el.style.textIndent='0';  el.innerHTML=Engine.fmtH(text);
  return el;
}
function renderOutline(){
  var ol=document.getElementById('outline');
  ol.innerHTML='';
  for(var i=0;i<gNodes.length;i++){
    var n=gNodes[i];
    if(n.kind!=='heading')continue;
    (function(n){
      var d=document.createElement('div');
      d.className='outline-item lv'+n.level;
      d.textContent=Engine.displayText(n.text);
      d.onclick=function(){
        var t=document.querySelector('#display-pane [data-bid="'+n.bid+'"]');
        if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
      };
      ol.appendChild(d);
    })(n);
  }
}
function renderStatus(){
  var chars=0, labels=0;
  for(var i=0;i<gNodes.length;i++){
    if(gNodes[i].kind==='obj')continue;
    if(gNodes[i].text)chars+=Engine.displayText(gNodes[i].text).replace(/\s/g,'').length;
    if(gNodes[i].text&&gNodes[i].text.indexOf('label')>=0)labels++;
  }
  document.getElementById('st-words').textContent=chars+' 字';
  document.getElementById('st-labels').textContent='标签 '+labels;
  document.getElementById('st-page').textContent='共 '+gPages.length+' 页';
}

// ═══ 编辑同步:输入 → 序列化 → 必要时重排 ═══
var repagTimer=null,lastEditSource=null;
function onPaperInput(){
  if(repagTimer)clearTimeout(repagTimer);
  repagTimer=setTimeout(applySyncNow,300);
}
function swapSplit(){
  var ws=document.querySelector('.workspace');
  var dp=document.getElementById('display-pane');
  var sp=document.getElementById('syntax-pane');
  if(!dp||!sp)return;
  if(dp.nextElementSibling===sp){ ws.insertBefore(sp,dp); }
  else{ ws.insertBefore(dp,sp); }
}
function updateGutter(){
  var g=document.getElementById('gutter');
  var ta=document.getElementById('syntax-src');
  if(!g||!ta)return;
  var n=ta.value.split('\n').length;
  var out='';
  for(var i=1;i<=n;i++)out+=i+'\n';
  if(g.textContent!==out)g.textContent=out;
  g.scrollTop=ta.scrollTop;
}
function applySyncNow(){
  if(repagTimer){clearTimeout(repagTimer);repagTimer=null}
  if(lastEditSource==='syntax'||currentMode==='syntax'){
    // 语法视图/语法侧编辑:输入框即源码权威(§85),不再从纸面 DOM 反写
    var ta=document.getElementById('syntax-src');
    var taVal=ta?ta.value:'';
    if(taVal===gSrc)return;
    gSrc=taVal;
    if(currentMode==='split')render(gSrc);
    updateDiagBar();
    scheduleNativeDiags();
    return;
  }
  // 纸面编辑:DOM 序列化回写(含跨页片段合并)
  var newSrc=Engine.serializeAll();
  if(newSrc===gSrc)return;
  gSrc=newSrc;
  var ta=document.getElementById('syntax-src');
  if(ta)ta.value=gSrc;
  recordHist(gSrc,true);
  var caret=saveCaret();
  var before=gPages.length+'|'+gPages.map(function(p){return p.length?p[0].b.bid:-1}).join(',');
  gNodes=Engine.parse(gSrc);
  gPages=Engine.layoutPages(gNodes);
  var after=gPages.length+'|'+gPages.map(function(p){return p.length?p[0].b.bid:-1}).join(',');
  if(before!==after){ renderNodes(); restoreCaret(caret) }
  else { renderOutline(); renderStatus() }
}
function saveCaret(){
  var s=window.getSelection();
  if(!s.rangeCount)return null;
  var node=s.getRangeAt(0).startContainer;
  var blk=node.nodeType===1?(node.closest?node.closest('[data-bid]'):null):(node.parentElement&&node.parentElement.closest('[data-bid]'));
  if(!blk)return null;
  var r=s.getRangeAt(0).cloneRange();
  r.selectNodeContents(blk);
  r.setEnd(s.getRangeAt(0).endContainer,s.getRangeAt(0).endOffset);
  return{bid:blk.dataset.bid,off:r.toString().length};
}
function restoreCaret(c){
  if(!c)return;
  var el=document.querySelector('#display-pane [data-bid="'+c.bid+'"]');
  if(!el)return;
  var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), n, left=c.off, last=null, first=null;
  while((n=walker.nextNode())){ if(first===null)first=n; if(n.length>=left){ setSel(n,left); focusPaper(el); return } left-=n.length; last=n }
  if(last){ setSel(last,last.length) } else if(first){ setSel(first,0) }
  focusPaper(el);
}
function setSel(node,off){
  var r=document.createRange(); r.setStart(node,off); r.collapse(true);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusPaper(el){
  var p=el.closest?el.closest('.paper'):null;
  if(p&&p.focus)p.focus({preventScroll:true});
}
// 跨页合并:Backspace 在页首块起点 / Delete 在页尾块终点
function onPaperKey(e){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='b'){ e.preventDefault(); fmtCmd('bold'); return }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='i'){ e.preventDefault(); fmtCmd('italic'); return }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='u'){ e.preventDefault(); fmtCmd('underline'); return }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); doSave(); return }
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('table')){ e.preventDefault(); return }
  if(e.key==='Backspace'){
    var c=saveCaret();
    if(c&&c.off===0){
      var el=document.querySelector('#display-pane [data-bid="'+c.bid+'"]');
      var paper=el&&el.closest('.paper');
      if(paper){
        var first=paper.querySelector('[data-bid]');
        if(first===el&&+c.bid>0){
          var prev=nodeByBid(+c.bid-1);
          if(prev&&prev.kind!=='table'&&prev.kind!=='obj'){ e.preventDefault(); mergeBlocks(+c.bid-1,+c.bid) }
        }
      }
    }
  }
  else if(e.key==='Delete'){
    var c2=saveCaret();
    if(c2){
      var el2=document.querySelector('#display-pane [data-bid="'+c2.bid+'"]');
      var paper2=el2&&el2.closest('.paper');
      if(paper2){
        var blocks=paper2.querySelectorAll('[data-bid]');
        var lastEl=blocks[blocks.length-1];
        var len=textLen(lastEl);
        if(lastEl===el2&&c2.off>=len){
          var next=nodeByBid(+c2.bid+1);
          if(next&&next.kind!=='table'&&next.kind!=='obj'){ e.preventDefault(); mergeBlocks(+c2.bid,+c2.bid+1) }
        }
      }
    }
  }
}
function textLen(el){ return (el.textContent||'').length }
function nodeByBid(bid){
  for(var i=0;i<gNodes.length;i++){ if(gNodes[i].bid==bid)return gNodes[i] }
  return null;
}
function mergeBlocks(keepBid,goneBid){
  var keep=nodeByBid(keepBid), gone=nodeByBid(goneBid);
  if(!keep||!gone)return;
  var keepEl=document.querySelector('#display-pane [data-bid="'+keepBid+'"]');
  var goneEl=document.querySelector('#display-pane [data-bid="'+goneBid+'"]');
  var keepText=keepEl?Engine.inlineSource(keepEl).trim():Engine.displayText(keep.text);
  var goneText=goneEl?Engine.inlineSource(goneEl).trim():Engine.displayText(gone.text);
  var junction=keepText.length;
  var lines=gSrc.split('\n');
  var mergedLine=Engine.blockPrefix(keep.kind,keep.level)+(keepText+' '+goneText).replace(/\s+/g,' ').trim();
  lines.splice(keep.srcStart,gone.srcEnd-keep.srcStart,mergedLine);
  var caret={bid:keepBid,off:junction+1};
  render(lines.join('\n'));
  restoreCaret(caret);
  recordHist(gSrc,false);
}

// ═══ 原生引擎(桌面版):诊断刷新 + 打开时权威初渲染 ═══
var nativeDiags=null, nativeTimer=null;
function allDiags(){
  if(nativeDiags&&nativeDiags.src===gSrc)return nativeDiags.ds;
  if(CORE_DIAGS.length)return CORE_DIAGS;
  return Engine.quickDiags(gSrc);
}
function scheduleNativeDiags(){
  if(!Bridge.native)return;
  if(nativeTimer)clearTimeout(nativeTimer);
  nativeTimer=setTimeout(refreshNativeDiags,800);
}
function refreshNativeDiags(){
  if(!Bridge.native)return;
  var atReq=gSrc;
  Bridge.parse(atReq).then(function(res){
    if(!res.native)return;
    if(gSrc!==atReq)return;
    adoptNativeResult(res);
  });
}
// 原生结果落地:诊断 + 块结构交叉比对 + (可选)权威重渲染
function adoptNativeResult(res){
  var ds=(res.diags&&res.diags.length)?res.diags:Engine.quickDiags(gSrc);
  var localCount=Engine.parse(gSrc).length;
  if(res.blocks&&res.blocks.length&&res.blocks.length!==localCount){
    ds=ds.concat([{sev:'warn',msg:'引擎分歧:原生 '+res.blocks.length+' 块 / 预览 '+localCount+' 块',line:1}]);
  }
  nativeDiags={src:gSrc,ds:ds};
  updateDiagBar();
}
// 打开/初始化后:以原生解析结果重建文档结构(桌面版权威路径)
function adoptNativeBlocks(){
  if(!Bridge.native)return;
  var atReq=gSrc;
  Bridge.parse(atReq).then(function(res){
    if(!res.native||!res.blocks||!res.blocks.length)return;
    if(gSrc!==atReq)return;
    adoptNativeResult(res);
    var caret=saveCaret();
    gNodes=Engine.ingestNative(res.blocks,gSrc);
    gPages=Engine.layoutPages(gNodes);
    renderNodes();
    restoreCaret(caret);
  });
}

// ═══ 工具栏命令 ═══
function inDisplayMode(){ return currentMode!=='syntax' }
function fmtCmd(cmd){
  if(inDisplayMode()){
    document.execCommand(cmd,false,null);
    onPaperInput();
  }else{
    var map={bold:['**','**'],italic:['_','_'],underline:['@[u]','@[/u]'],strikeThrough:['~~','~~'],superscript:['@[sup]','@[/sup]'],subscript:['@[sub]','@[/sub]']};
    if(map[cmd])wrapSyntax(map[cmd][0],map[cmd][1]);
  }
}
function fmtCmdInline(){
  if(inDisplayMode()){
    var s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed)return;
    var r=s.getRangeAt(0);
    var b1=(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('[data-bid]');
    var b2=(r.endContainer.nodeType===1?r.endContainer:r.endContainer.parentElement).closest('[data-bid]');
    if(!b1||b1!==b2){ document.getElementById('findmsg').textContent='行内代码不能跨段落'; return }
    var code=document.createElement('code');
    code.appendChild(r.extractContents());
    r.insertNode(code);
    onPaperInput();
  }
  else wrapSyntax('`','`');
}
// 保格式包裹:保留选区内嵌套标记,跨段落拒绝
function wrapSpan(open, close, style, native){
  var s=window.getSelection();
  if(!s.rangeCount||s.isCollapsed)return false;
  var r=s.getRangeAt(0);
  var b1=(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('[data-bid]');
  var b2=(r.endContainer.nodeType===1?r.endContainer:r.endContainer.parentElement).closest('[data-bid]');
  if(!b1||b1!==b2){ document.getElementById('findmsg').textContent='该格式不能跨段落选择'; return false }
  var wrap=document.createElement(native?'code':'span');
  if(!native){
    wrap.dataset.cmd=open; wrap.dataset.close=close;
  }
  if(style)for(var k in style)wrap.style[k]=style[k];
  wrap.appendChild(r.extractContents());
  r.insertNode(wrap);
  s.removeAllRanges();
  var nr=document.createRange(); nr.selectNodeContents(wrap); s.addRange(nr);
  return true;
}

function applyColor(v){
  if(inDisplayMode()){ document.execCommand('foreColor',false,v); onPaperInput() }
  else wrapSyntax('@[color '+v+']','@[/color]');
}
function applyMark(v){

    var s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed)return;

}
function applySize(v){

function applyStyle(lv){
  if(lv==='')return;
  var bel=caretBlock();
  var bid;
  if(bel)bid=+bel.dataset.bid;
  else{
    var ta=document.getElementById('syntax-src');
    if(!ta)return;
    var pos=ta.value.substring(0,ta.selectionStart).split('\n').length-1;
    for(var i=0;i<gNodes.length;i++){ if(pos>=gNodes[i].srcStart&&pos<gNodes[i].srcEnd){ bid=gNodes[i].bid; break } }
    if(bid===undefined)return;
  }
  var b=nodeByBid(bid);
  if(!b)return;
  var el=document.querySelector('#display-pane [data-bid="'+bid+'"]');
  var body=el?Engine.inlineSource(el).replace(/^#+\s*/,'').trim():Engine.displayText(b.text);
  var lines=gSrc.split('\n');
  lines.splice(b.srcStart,b.srcEnd-b.srcStart,'#'.repeat(+lv)+' '+body);
  setSrc(lines.join('\n'));
  restoreCaret({bid:bid,off:0});
}
function listCmd(kind){
  if(inDisplayMode()){
    document.execCommand(kind==='ul'?'insertUnorderedList':'insertOrderedList',false,null);
    onPaperInput();
  }else insertSyntax(kind==='ul'?'\n- 列表项\n':'\n1. 列表项\n');
}
function insertBlock(kind){
  var snippets={
    quote:['> 引用内容'],
    hr:['---'],
    link:['@[link 链接文字 url: https://example.com]'],
    image:null,
    table:['@[table demo]','| 列1 | 列2 |','| --- | --- |','| 内容 | 内容 |','@[/table]'],
    toc:['@[toc depth: 2]'],
    comment:['@[comment 批注内容,不参与渲染]'],
    footnote:['@[footnote 1 脚注内容]']
  };
  if(kind==='image'){pickImageInsert();return}
  var ins=snippets[kind];
  if(inDisplayMode()){
    // 在当前块后插入新块
    var bel=caretBlock();
    var _caret=saveCaret();
    var insertAt=gSrc.split('\n').length;
    if(bel){
      var b=nodeByBid(bel.dataset.bid);
      if(b)insertAt=b.srcEnd;
    }
    var lines=gSrc.split('\n');
    var insert=ins.slice();
    if(insertAt<lines.length&&lines[insertAt].trim()!=='')insert=insert.concat(['']);
    if(insertAt>0&&lines[insertAt-1].trim()!=='')insert=[''].concat(insert);
    lines.splice.apply(lines,[insertAt,0].concat(insert));
    setSrc(lines.join('\n'));
    restoreCaret(_caret);
  }else insertSyntax('\n'+ins.join('\n')+'\n');
}

function inTable(){ var b=caretBlock(); return b&&b.closest?b.closest('table'):null }
function selTr(){
  var s=window.getSelection();
  if(!s.rangeCount)return null;
  var n=s.getRangeAt(0).startContainer;
  var el=n.nodeType===1?n:n.parentElement;
  return el?el.closest('tr'):null;
}
function selCell(){
  var s=window.getSelection();
  if(!s.rangeCount)return null;
  var n=s.getRangeAt(0).startContainer;
  var el=n.nodeType===1?n:n.parentElement;
  return el?el.closest('th,td'):null;
}
function tblInsRow(){
  var tbl=inTable(); if(!tbl)return;
  var tr=selTr();
  var nr=tr.cloneNode(true);
  nr.querySelectorAll('th,td').forEach(function(c){c.textContent=''});
  tr.parentNode.insertBefore(nr,tr.nextSibling);
  onPaperInput();
}
function tblDelRow(){
  var tbl=inTable(); if(!tbl)return;
  var body=tbl.querySelector('tbody')||tbl;
  if(body.querySelectorAll('tr').length<=1)return;
  var tr=selTr();

function tblInsCol(){
  var tbl=inTable(); if(!tbl)return;
  var ref=selCell();
  tbl.querySelectorAll('tr').forEach(function(tr){
    var cell=document.createElement('td');
    if(ref&&tr.contains(ref))cell=document.createElement(ref.tagName);
    tr.insertBefore(cell,tr.lastElementChild.nextSibling);
  });
  onPaperInput();
}
function tblDelCol(){
  var tbl=inTable(); if(!tbl)return;
  var ref=selCell();
  var idx=ref?Array.prototype.indexOf.call(ref.parentNode.children,ref):0;
  var rows=tbl.querySelectorAll('tr');
  var cols=rows[0].querySelectorAll('th,td').length;
  if(cols<=1)return;
  rows.forEach(function(tr){ var c=tr.children[idx]; if(c)tr.removeChild(c) });
  onPaperInput();
}

// ═══ 查找替换 ═══
function toggleFind(){
  var bar=document.getElementById('findbar');
  var open=bar.style.display==='none'||!bar.style.display;
  bar.style.display=open?'block':'none';
  if(open){document.getElementById('findbox').focus();findCount()}
}
function closeFind(){
  document.getElementById('findbar').style.display='none';
}
function findIdxOf(src,q,from){
  var cs=document.getElementById('cb-case')&&document.getElementById('cb-case').checked;
  if(cs)return src.indexOf(q,from);
  return src.toLowerCase().indexOf(q.toLowerCase(),from);
}
function cs0(){return document.getElementById('cb-case')&&document.getElementById('cb-case').checked}
function findCount(){
  var q=document.getElementById('findbox').value;
  var msg=document.getElementById('findmsg');
  highlightAll(q);
  if(!q){msg.textContent='';return}
  var n=0,i=0;
  while((i=findIdxOf(gSrc,q,i))>=0){n++;i+=q.length}
  msg.textContent=n?'找到 '+n+' 处':'未找到';
}
function highlightAll(q){
  if(!(window.CSS&&CSS.highlights))return;
  CSS.highlights.delete('findhit');
  if(!q||!inDisplayMode())return;
  var ranges=[];
  document.querySelectorAll('#display-pane .paper').forEach(function(paper){
    var walker=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT),node;
    var texts=[],nodes=[];
    while((node=walker.nextNode())){nodes.push(node);texts.push(node.textContent)}
    var hay=texts.join('');
    var needle=cs0()?q:q.toLowerCase();
    if(!cs0())hay=hay.toLowerCase();
    var starts=[],pos=0;
    while((pos=hay.indexOf(needle,pos))>=0){starts.push(pos);pos+=needle.length}
    if(!starts.length)return;
    var bounds=[],acc=0;
    nodes.forEach(function(n){bounds.push([acc,acc+n.length]);acc+=n.length});
    starts.forEach(function(st){
      var en=st+q.length;
      var r1=null,r2=null;
      for(var i=0;i<nodes.length;i++){
        if(st>=bounds[i][0]&&st<bounds[i][1])r1={n:nodes[i],o:st-bounds[i][0]};
        if(en>bounds[i][0]&&en<=bounds[i][1])r2={n:nodes[i],o:en-bounds[i][0]};
      }
      if(r1&&r2){var rg=document.createRange();rg.setStart(r1.n,r1.o);rg.setEnd(r2.n,r2.o);ranges.push(rg)}
    });
  });
  if(ranges.length){try{CSS.highlights.set('findhit',new Highlight(ranges))}catch(e){}}
}
function findNext(){
  var q=document.getElementById('findbox').value;
  if(!q)return;
  if(inDisplayMode()){
    if(!window.find(q,cs0()))document.getElementById('findmsg').textContent='已到结尾';
  }else{
    var ta=document.getElementById('syntax-src');
    var from=ta.selectionEnd;
    var i=findIdxOf(gSrc,q,from);
    if(i<0)i=findIdxOf(gSrc,q,0);
    if(i>=0){ta.focus();ta.setSelectionRange(i,i+q.length)}
  }
}
function findPrev(){
  var q=document.getElementById('findbox').value;
  if(!q)return;
  if(inDisplayMode()){
    if(!window.find(q,cs0(),true))document.getElementById('findmsg').textContent='已到开头';
  }else{
    var ta=document.getElementById('syntax-src');
    var before=gSrc.substring(0,ta.selectionStart||0).lastIndexOf(q);
    if(before>=0){ta.focus();ta.setSelectionRange(before,before+q.length)}
    else document.getElementById('findmsg').textContent='已到开头';
  }
}
function replaceOne(){
  var q=document.getElementById('findbox').value;
  var r=document.getElementById('replacebox').value;
  if(!q)return;
  var src=gSrc;
  var i;
  var ta=document.getElementById('syntax-src');
  if(inDisplayMode()&&window.getSelection&&!window.getSelection().isCollapsed){
    i=saveCaret()?src.indexOf(q):src.indexOf(q);
  }else if(ta&&document.activeElement===ta){
    i=src.indexOf(q,ta.selectionStart);
  }else{
    i=src.indexOf(q);
  }
  if(i<0)i=src.indexOf(q);
  if(i<0){document.getElementById('findmsg').textContent='未找到';return}
  setSrc(src.substring(0,i)+r+src.substring(i+q.length));
  document.getElementById('findmsg').textContent='已替换 1 处';
}
function replaceAll(){
  var q=document.getElementById('findbox').value;
  var r=document.getElementById('replacebox').value;
  if(!q)return;
  var cs=cs0();
  var hay=cs?gSrc:gSrc.toLowerCase(),needle=cs?q:q.toLowerCase();
  var n=0,i=0,out='';
  while(i<hay.length){
    var j=hay.indexOf(needle,i);
    if(j<0){out+=gSrc.substring(i);break}
    out+=gSrc.substring(i,j)+r;
    i=j+q.length;n++;
  }
  if(n)setSrc(out);
  highlightAll(q);
  document.getElementById('findmsg').textContent='已替换 '+n+' 处';
}

function toggleFirstLine(){
  var lines=gSrc.split('\n');
  var idx=-1;
  for(var i=0;i<lines.length;i++){ if(lines[i].indexOf('@[first-line')===0){idx=i;break} }
  if(idx>=0){ lines.splice(idx,1); document.getElementById('btn-firstline').classList.remove('on') }
  else{
    var at=0;
    for(var j=0;j<lines.length;j++){ if(lines[j].indexOf('@[')===0)at=j+1; else break }
    lines.splice(at,0,'@[first-line 2em]');
    document.getElementById('btn-firstline').classList.add('on');
  }
  setSrc(lines.join('\n'));
}

// ═══ 导出与打印 ═══
function exportFile(kind){
  if(kind==='txt'){saveWithPicker(fname('txt'),gSrc);return}
  if(kind==='md'){
    var out=[],lines=gSrc.split('\n');
    for(var i=0;i<lines.length;i++){
      var t=lines[i];
      if(/^@\[(page|margin|font|size|line-spacing|first-line|theme|toc|numbering)\s/.test(t))continue;
      if(/^@\[table/.test(t)||/^@\[\/table\]/.test(t))continue;
      if(/^@\[comment/.test(t)){while(i<lines.length&&lines[i].indexOf('@[/comment]')<0)i++;continue}
      var m=t.match(/^@\[image\s+([^\]]+)\]$/);
      if(m){out.push('!['+m[1]+']('+m[1]+')');continue}
      t=t.replace(/@\[link\s+([^\]]+?)\s+url:\s*([^\]]+)\]/g,'[$1]($2)');
      t=t.replace(/@\[u\]((?:.|])*?)@\[\/u\]/g,'<u>$1</u>');
      out.push(t);
    }
    saveWithPicker(fname('md'),out.join('\n'));
    return;
  }
  if(kind==='html'||kind==='doc'){
    var papers=document.querySelectorAll('#display-pane .paper');
    var body='';
    papers.forEach(function(pp){body+=pp.innerHTML});
    var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Awen 文档</title><style>'
      +'body{margin:0;background:#e8e9eb}'
      +'.sheet{width:'+CFG.PAGE_W+'mm;min-height:'+CFG.PAGE_H+'mm;background:#fff;margin:16px auto;padding:'+CFG.MARGIN+'mm;box-sizing:border-box;font-family:Georgia,"Times New Roman","Noto Serif SC","Microsoft YaHei",serif;font-size:11pt;line-height:'+CFG.LINE_H+';color:#303238}'
      +'h1{font-size:22pt}h2{font-size:15pt}h3{font-size:13pt}h4{font-size:12pt}h5{font-size:11pt}h6{font-size:10.5pt}'
      +'p{text-indent:2em;margin:0}strong,b{font-weight:700}em,i{font-style:italic}del,s{text-decoration:line-through}u{text-decoration:underline}'
      +'code{font-family:Consolas,monospace;font-size:.87em;background:#f0f1f2;padding:1px 4px;border-radius:3px}'
      +'hr{border:none;border-top:1px solid #ccc}blockquote{border-left:3px solid #c8cad0;padding:2px 14px;color:#5a5c60;margin:0}'
      +'ul,ol{margin:0;padding-left:2.4em}table{width:100%;border-collapse:collapse;font-size:10.5pt}'
      +'th,td{border:1px solid #d0d2d5;padding:4px 8px;text-align:left}th{background:#f5f5f6}'
      +'.docset{color:#c8cad0;font-size:8pt}.comment-src{background:#fffbe8;color:#b09a3e;font-size:9pt}'
      +'</style></head><body>'+body+'</body></html>';
    saveWithPicker(fname(kind==='html'?'html':'doc'),html);
  }
}

// ═══ 语法视图(同一 A4 纸张几何)═══
function buildSyntaxPane(){
  if(document.getElementById('syntax-src'))return;
  var pane=document.getElementById('syntax-pane');
  var sheet=document.createElement('div');
  sheet.className='sheet';
  var src=document.createElement('div');
  src.className='src-wrap';
  var gutter=document.createElement('div');
  gutter.id='gutter'; gutter.className='gutter';
  var ta=document.createElement('textarea');
  ta.id='syntax-src'; ta.spellcheck=false;
  ta.style.cssText='flex:1;height:'+(CFG.PAGE_H-2*CFG.MARGIN-2)+'mm;border:0;outline:0;resize:none;background:transparent;font:inherit;color:inherit;white-space:pre;overflow:auto';
  src.appendChild(gutter);
  src.appendChild(ta);
  sheet.appendChild(src);
  pane.appendChild(sheet);
  ta.addEventListener('scroll',function(){
    gutter.scrollTop=ta.scrollTop;
    if(!window.scrollSyncLock&&currentMode==='split'){
      window.scrollSyncLock='ta';
      var pane=document.getElementById('display-pane');
      var ratio=ta.scrollTop/Math.max(1,ta.scrollHeight-ta.clientHeight);
      pane.scrollTop=ratio*Math.max(1,pane.scrollHeight-pane.clientHeight);
      setTimeout(function(){window.scrollSyncLock=null},50);
    }
  });
  document.getElementById('display-pane').addEventListener('scroll',function(){
    if(currentMode!=='split'||window.scrollSyncLock)return;
    window.scrollSyncLock='dp';
    var ta2=document.getElementById('syntax-src');
    if(!ta2)return;
    var pane2=document.getElementById('display-pane');
    var ratio=pane2.scrollTop/Math.max(1,pane2.scrollHeight-pane2.clientHeight);
    ta2.scrollTop=ratio*Math.max(1,ta2.scrollHeight-ta2.clientHeight);
    gutter.scrollTop=ta2.scrollTop;
    setTimeout(function(){window.scrollSyncLock=null},50);
  });
  ta.addEventListener('input',function(){
    lastEditSource='syntax';
    recordHist(ta.value,true);
    if(repagTimer)clearTimeout(repagTimer);
    repagTimer=setTimeout(applySyncNow,300);
  });
}
function insertSyntax(text){
  var ta=document.getElementById('syntax-src');
  if(!ta)return;
  var s=ta.selectionStart;
  ta.value=ta.value.substring(0,s)+text+ta.value.substring(ta.selectionEnd);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.focus();
  setSrc(ta.value);
}
function wrapSyntax(open,close){
  var ta=document.getElementById('syntax-src');
  if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd;
  var sel=ta.value.substring(s,e)||'文本';
  ta.focus();
  ta.value=ta.value.substring(0,s)+open+sel+close+ta.value.substring(e);
  ta.selectionStart=s+open.length;
  ta.selectionEnd=s+open.length+sel.length;
  setSrc(ta.value);
}

// ═══ 撤销/重做 ═══
var hist=[],histIdx=-1,histTime=0;
var docDirty=false;
function recordHist(text,merge){
  var now=Date.now();
  if(merge&&histIdx>=0&&now-histTime<500){ hist[histIdx]=text; histTime=now; markDirty(); return }
  hist=hist.slice(0,histIdx+1);
  hist.push(text);
  if(hist.length>300)hist.shift();
  histIdx=hist.length-1;
  histTime=now;
  markDirty();
}
function markDirty(){
  docDirty=true;
  updateTitle();
  updateUndoButtons();
  updateDiagBar();
  scheduleNativeDiags();
}
function updateUndoButtons(){
  document.querySelectorAll('button[onclick="doUndo()"]').forEach(function(b){b.disabled=histIdx<=0});
  document.querySelectorAll('button[onclick="doRedo()"]').forEach(function(b){b.disabled=histIdx>=hist.length-1});
}
function doUndo(){
  applySyncNow();
  if(histIdx<=0)return;
  histIdx--;
  applyHistory(hist[histIdx]);
}
function doRedo(){
  applySyncNow();
  if(histIdx>=hist.length-1)return;
  histIdx++;
  applyHistory(hist[histIdx]);
}
function applyHistory(text){
  var caret=saveCaret();
  var ta=document.getElementById('syntax-src');
  if(ta)ta.value=text;
  render(text);
  restoreCaret(caret);
  updateDiagBar();
  updateUndoButtons();
  document.getElementById('st-diag').title='历史 '+histIdx+'/'+(hist.length-1);
}
function setSrc(s){
  var ta=document.getElementById('syntax-src');
  if(ta)ta.value=s;
  recordHist(s,false);
  render(s);
  var norm=Engine.serializeAll();
  if(norm!==s){ render(norm); }
  updateDiagBar();
  scheduleNativeDiags();
}

function insertTableGrid(){

function pickImageInsert(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files[0];
    if(!f)return;
    if(f.size>1024*1024){alert('图片超过 1MB,原型阶段请使用小图');return}
    var rd=new FileReader();
    rd.onload=function(){
      insertRawLine('@[image '+rd.result+']');
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function insertRawLine(line){
  var bel=inDisplayMode()?caretBlock():null;
  var lines=gSrc.split('\n');
  var at=lines.length;
  if(bel){var b=nodeByBid(bel.dataset.bid);if(b)at=b.srcEnd}
  if(at<lines.length&&lines[at].trim()!=='')line=line+'\n';
  if(at>0&&lines[at-1].trim()!=='')line='\n'+line;
  lines.splice(at,0,line);
  setSrc(lines.join('\n'));
}

// 工具栏按钮按下不清除文字选区(Word 式行为)
document.querySelectorAll('.ribbon,.tabbar,#minibar,#float-pal').forEach(function(root){
  if(!root)return;
  root.addEventListener('mousedown',function(e){
    if(e.target.closest('button,label,.sw'))e.preventDefault();
  });
});

// ═══ 多文件管理 ═══
var openFiles=[];
var activeFile=-1;
function renderFileTabs(){
  var bar=document.getElementById('filetabs');
  bar.innerHTML='';
  openFiles.forEach(function(f,i){
    var t=document.createElement('div');
    t.className='ftab'+(i===activeFile?' active':'')+(f.dirty?' dirty':'');
    t.innerHTML='<span class="fdirty"></span><span>'+f.name.replace(/</g,'&lt;')+'</span><span class="fclose" data-i="'+i+'">✕</span>';
    t.onclick=function(ev){
      if(ev.target.classList.contains('fclose')){closeFile(i);return}
      switchFile(i);
    };
    bar.appendChild(t);
  });
}
function switchFile(i){
  if(i===activeFile)return;
  applySyncNow();
  openFiles[activeFile].src=gSrc;
  openFiles[activeFile].dirty=docDirty;
  activeFile=i;
  var f=openFiles[i];
  document.getElementById('docname').value=f.name;
  setSrc(f.src);
  docDirty=f.dirty;
  updateTitle();
  renderFileTabs();
}
function closeFile(i){
  if(openFiles[i].dirty&&!window.confirm('「'+openFiles[i].name+'」未保存,确定关闭?'))return;
  openFiles.splice(i,1);
  if(activeFile>=i)activeFile--;
  if(activeFile>=openFiles.length)activeFile=openFiles.length-1;
  if(!openFiles.length){ newDoc(); return }
  var f=openFiles[activeFile];
  document.getElementById('docname').value=f.name;
  setSrc(f.src);
  docDirty=f.dirty;
  updateTitle();
  renderFileTabs();
}
function addFileTab(name){
  openFiles.push({name:name,src:gSrc,dirty:docDirty});
  activeFile=openFiles.length-1;
}

// ═══ 功能区折叠 ═══
var ribbonCollapsed=false;
function toggleRibbonCollapse(){
  ribbonCollapsed=!ribbonCollapsed;
  var r=document.querySelector('.ribbon');
  r.style.display=ribbonCollapsed?'none':'block';
  document.getElementById('btn-collapse').style.transform=ribbonCollapsed?'rotate(180deg)':'';
}

// ═══ 字数统计对话框 ═══
function showWordCount(){
  var chars=0, charsSp=0, paras=0, words=0;
  var paper=document.querySelector('#display-pane .paper');
  if(paper){
    var txt=paper.textContent;
    charsSp=txt.replace(/\s{2,}/g,' ').trim().length;
    chars=txt.replace(/\s/g,'').length;
    paras=gNodes.filter(function(n){return n.kind==='para'||n.kind==='heading'}).length;
  }
  var pop=document.getElementById('diagpop');
  pop.innerHTML='<div style="font-weight:600;margin-bottom:6px">字数统计</div>'
    +'<div>字数(不计空格): <b>'+chars+'</b></div>'
    +'<div>字符数(计空格): <b>'+charsSp+'</b></div>'
    +'<div>段落数: <b>'+paras+'</b></div>'
    +'<div>页数: <b>'+gPages.length+'</b></div>';
  pop.style.display='block';
  setTimeout(function(){pop.style.display='none'},4000);
}

// ═══ 全局快捷键(对照 Word)═══
document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey;
  if(!mod)return;
  var k=(e.key||'').toLowerCase();
  if(k==='f'){e.preventDefault();toggleFind();return}
  if(k==='h'){e.preventDefault();toggleFind();var rb=document.getElementById('replacebox');if(rb)rb.focus();return}
  if(k==='p'){e.preventDefault();doPrint();return}
  if(k==='s'){e.preventDefault();doSave();return}
  if(k==='e'){e.preventDefault();if(inDisplayMode()){document.execCommand('justifyCenter');onPaperInput()}return}
  if(k==='l'){e.preventDefault();if(inDisplayMode()){document.execCommand('justifyLeft');onPaperInput()}return}
  if(k==='r'&&!e.shiftKey){e.preventDefault();if(inDisplayMode()){document.execCommand('justifyRight');onPaperInput()}return}
  if(k==='j'){e.preventDefault();if(inDisplayMode()){document.execCommand('justifyFull');onPaperInput()}return}
});

// ═══ 大纲滚动高亮跟随 ═══
var spyTimer=null;
document.getElementById('display-pane').addEventListener('scroll',function(){
  document.getElementById('minibar').style.display='none';
  if(spyTimer)clearTimeout(spyTimer);
  spyTimer=setTimeout(spyOutline,160);
});
function spyOutline(){
  var heads=document.querySelectorAll('#display-pane [data-kind="heading"]');
  var pane=document.getElementById('display-pane');
  var top=pane.getBoundingClientRect().top;
  var threshold=pane.clientHeight*0.3;
  var cur=null;
  heads.forEach(function(h){
    var r=h.getBoundingClientRect();
    if(r.top-top<=threshold)cur=h;
  });
  document.querySelectorAll('.outline-item').forEach(function(o){o.classList.remove('active')});
  if(cur){
    var bid=cur.dataset.bid;
    document.querySelectorAll('.outline-item').forEach(function(o){
      if(o.dataset.bid==bid)o.classList.add('active');
    });
  }
}
// 大纲条目记录对应 bid(渲染时)
var _oldRenderOutline=renderOutline;
renderOutline=function(){
  _oldRenderOutline();
  document.querySelectorAll('.outline-item').forEach(function(o,i){
    var heads=gNodes.filter(function(n){return n.kind==='heading'});
    if(heads[i])o.dataset.bid=heads[i].bid;
  });
  spyOutline();
};

// ═══ 初始化 ═══
(function init(){
  document.querySelectorAll('[data-icon]').forEach(function(el){
    el.innerHTML=ICONS[el.dataset.icon]||'';
  });
  var src=DEFAULT_SRC;
  if(DOC_DATA&&DOC_DATA.source)src=DOC_DATA.source;
  buildSyntaxPane();
  setSrc(src);
  if(gSrc.indexOf('@[first-line')>=0){ var b=document.getElementById('btn-firstline'); if(b)b.classList.add('on') }
  docDirty=false; updateTitle(); updateUndoButtons(); updateDiagBar(); updateCaretPos();
  document.getElementById('docname').addEventListener('input',function(){updateTitle('docname')});
  var en=document.getElementById('export-name');
  if(en)en.addEventListener('input',function(){
    updateTitle('export');
    var dn=document.getElementById('docname');
    if(document.activeElement===en&&en.value.trim())dn.value=en.value.trim();
  });
  // 桌面版:初始化后立即用原生引擎刷新诊断并做权威初渲染
  if(Bridge.native){ refreshNativeDiags(); adoptNativeBlocks(); }
})();
</script>
