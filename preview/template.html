<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awen</title>
<script src="engine.js"></script>
<script src="bridge.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="app">
<div class="titlebar">
<div class="qat">
<button class="rbtn" onclick="doUndo()" title="撤销 (Ctrl+Z)"><span data-icon="undo"></span></button>
<button class="rbtn" onclick="doRedo()" title="重做 (Ctrl+Y)"><span data-icon="redo"></span></button>
<button class="rbtn" onclick="doSave()" title="保存 (Ctrl+S)"><span data-icon="save"></span></button>
</div>
<div class="brand">Awen</div>
<input class="docname" id="docname" value="未命名文档" title="点击修改文档名"><span id="dirty-mark" style="font-size:11px;color:#c0392b;display:none">未保存</span>
</div>
<div class="filetabs" id="filetabs"></div>
<div class="tabbar">
<div class="tab active" data-page="home" onclick="showRibbon('home')" ondblclick="toggleRibbonCollapse()">开始</div>
<div class="tab" data-page="insert" onclick="showRibbon('insert')" ondblclick="toggleRibbonCollapse()">插入</div>
<div class="tab" data-page="page" onclick="showRibbon('page')" ondblclick="toggleRibbonCollapse()">页面</div>
<div class="tab" data-page="view" onclick="showRibbon('view')" ondblclick="toggleRibbonCollapse()">视图</div>
<div class="tab" data-page="file" onclick="showRibbon('file')" ondblclick="toggleRibbonCollapse()">文件</div>
<div style="flex:1"></div>
<button class="chev" onclick="toggleRibbonCollapse()" id="btn-collapse" title="折叠功能区(双击标签名同效)"><svg viewBox="0 0 16 16" style="width:13px;height:13px"><path d="M3 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<div class="ribbon">
<div class="ribbon-page active" data-page="home">
<div class="rgroup"><div class="rg-body">
<div class="colordrop splitbtn" style="flex-direction:column;width:36px">
<button class="rbtn" style="width:34px;height:20px" onclick="doPaste()" title="粘贴"><span data-icon="paste"></span></button>
<button class="rbtn" style="width:34px;height:12px;font-size:9px" onclick="pasteTextOnly()" title="只保留文本粘贴">T﹁</button>
</div>
<button class="rbtn" style="width:36px" onclick="doCut()" title="剪切"><span data-icon="cut"></span></button>
<button class="rbtn" style="width:36px" onclick="doCopy()" title="复制"><span data-icon="copy"></span></button>
<button class="rbtn" style="width:36px" id="btn-brush" onclick="brushClick()" ondblclick="brushDouble()" title="格式刷:单击吸取后选文字应用一次;双击连续应用"><span data-icon="brush"></span></button>
<button class="rbtn" onclick="toggleCase()" title="更改大小写(选中英文循环:aA/AA/aa)"><span data-icon="case"></span>Aa</button>
</div><div class="rg-label">剪贴板</div></div>
<div class="rgroup"><div class="rg-body"><div class="fcol">
<div class="frow">
<button class="rbtn" style="width:30px" onclick="stepSize(1)" title="增大字号 (Ctrl+Shift+.)"><span data-icon="fup"></span></button>
<button class="rbtn" style="width:30px" onclick="stepSize(-1)" title="减小字号 (Ctrl+Shift+,)"><span data-icon="fdown"></span></button>
<select id="sel-font" title="字体" onchange="applyFont(this.value)">
<optgroup label="中文"><option value="SimSun" selected>宋体</option><option value="SimHei">黑体</option><option value="KaiTi">楷体</option><option value="FangSong">仿宋</option><option value="Microsoft YaHei">微软雅黑</option><option value="DengXian">等线</option><option value="LiSu">隶书</option><option value="YouYuan">幼圆</option><option value="STZhongsong">华文中宋</option><option value="STXihei">华文细黑</option></optgroup>
<optgroup label="西文"><option value="Times New Roman">Times New Roman</option><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Cambria">Cambria</option><option value="Segoe UI">Segoe UI</option><option value="Courier New">Courier New</option><option value="Consolas">Consolas</option></optgroup>
</select>
<select id="sel-size" title="字号" onchange="applySize(this.value)">
<option value="10.5" selected>五号</option><option value="9">小五</option><option value="11">11 号</option><option value="12">小四</option><option value="14">四号</option><option value="16">三号</option><option value="18">二号</option><option value="22">一号</option>
</select>
</div>
<div class="frow">
<button class="rbtn b" onclick="fmtCmd('bold')" title="加粗 (Ctrl+B)">B</button>
<button class="rbtn i" onclick="fmtCmd('italic')" title="倾斜 (Ctrl+I)">I</button>
<button class="rbtn u" onclick="fmtCmd('underline')" title="下划线 (Ctrl+U)"><span style="text-decoration:underline">U</span></button>
<button class="rbtn s" onclick="fmtCmd('strikeThrough')" title="删除线"><span style="text-decoration:line-through">S</span></button>
<button class="rbtn supb" onclick="fmtCmd('superscript')" title="上标"><span>x²</span></button>
<button class="rbtn subb" onclick="fmtCmd('subscript')" title="下标"><span>x₂</span></button>
<div class="colordrop splitbtn" onclick="togglePal(event,'fore')">
<button class="rbtn"><span data-icon="fontcolor"></span></button>
<button class="half-caret" onclick="togglePal(event,'fore')">▾</button>
</div>
<div class="colordrop splitbtn" onclick="togglePal(event,'mark')">
<button class="rbtn" onclick="applyMark(curMark)" title="底纹高亮:点击应用,箭头选更多颜色"><span data-icon="mark"></span></button>
<button class="half-caret" onclick="togglePal(event,'mark')">▾</button>
</div>
<button class="rbtn mono" onclick="fmtCmdInline()" title="行内代码">&lt;/&gt;</button>
<button class="rbtn" onclick="fmtCmd('removeFormat')" title="清除格式"><span data-icon="clear"></span></button>
</div>
</div></div><div class="rg-label">字体</div></div>
<div class="rgroup"><div class="rg-body" style="gap:6px">
<div style="display:flex;gap:4px">
<button class="stylebtn" onclick="applyStyle('')" title="正文样式">正文</button>
<button class="stylebtn" style="font-weight:700;font-size:15px" onclick="applyStyle('1')" title="标题 1">标题 1</button>
<button class="stylebtn" style="font-weight:700;font-size:13px" onclick="applyStyle('2')" title="标题 2">标题 2</button>
<button class="stylebtn" style="font-weight:600;font-size:12px" onclick="applyStyle('3')" title="标题 3">标题 3</button>
</div>
<select id="sel-style" title="更多段落样式" onchange="applyStyle(this.value)" style="width:76px;height:32px">
<option value="" selected>正文</option><option value="1">1 级</option><option value="2">2 级</option><option value="3">3 级</option><option value="4">4 级</option><option value="5">5 级</option><option value="6">6 级</option>
</select>
</div><div class="rg-label">样式</div></div>
<div class="rgroup"><div class="rg-body">
<div class="rgrid3">
<button class="rbtn" onclick="listCmd('ul')" title="项目符号列表"><span data-icon="ul"></span></button>
<button class="rbtn" onclick="listCmd('ol')" title="编号列表"><span data-icon="ol"></span></button>
<button class="rbtn" onclick="cycleLineSpacing()" title="行距(循环切换)"><span data-icon="lineh"></span></button>
<button class="rbtn" id="al" onclick="fmtCmd('justifyLeft')" title="左对齐"><span data-icon="al"></span></button>
<button class="rbtn" id="ac" onclick="fmtCmd('justifyCenter')" title="居中"><span data-icon="ac"></span></button>
<button class="rbtn" id="ar" onclick="fmtCmd('justifyRight')" title="右对齐"><span data-icon="ar"></span></button>
<button class="rbtn" id="aj" onclick="fmtCmd('justifyFull')" title="两端对齐"><span data-icon="aj"></span></button>
</div>
</div><div class="rg-label">段落</div></div>
<div class="rgroup"><div class="rg-body">
<button class="rbtn" onclick="toggleFind()" title="查找 (Ctrl+F)"><span data-icon="search"></span></button>
<button class="rbtn" onclick="replaceEntry()" title="查找和替换 (Ctrl+H)"><span data-icon="replace"></span></button>
<button class="rbtn" onclick="selectAllDoc()" title="全选当前文档"><span data-icon="selall"></span></button>
</div><div class="rg-label">编辑</div></div>
</div>
<div class="findbar-pop" id="findbar">
<div class="fb-head"><span>查找和替换</span><span class="x" onclick="closeFind()">✕</span></div>
<div class="fb-body">
<div class="fb-row"><input type="text" id="findbox" placeholder="查找内容" oninput="findCount()" onkeydown="findKey(event)"></div>
<div class="fb-row"><input type="text" id="replacebox" placeholder="替换为"></div>
<div class="fb-row" style="justify-content:space-between">
<label style="display:flex;align-items:center;gap:3px"><input type="checkbox" id="cb-case">区分大小写</label>
<label style="display:flex;align-items:center;gap:3px"><input type="checkbox" id="cb-whole">全字匹配</label>
<label style="display:flex;align-items:center;gap:3px"><input type="checkbox" id="cb-down" checked>向下</label>
<label style="display:flex;align-items:center;gap:3px"><input type="checkbox" id="cb-up">向上</label>
</div>
<div class="fb-row"><span id="findmsg" style="font-size:12px;color:#6b6d72"></span></div>
<div class="fb-row" style="justify-content:space-between">
<button class="sbtn" onclick="findNext()">下一个</button>
<button class="sbtn" onclick="findPrev()">上一个</button>
<button class="sbtn" onclick="replaceOne()">替换</button>
<button class="sbtn" onclick="replaceAll()">全部替换</button>
</div>
</div>
</div>
<div class="ribbon-page" data-page="insert">
<div class="rgroup"><div class="rg-body">
<button class="tbtn" onclick="toggleTblPop(this)" title="插入表格"><span data-icon="table"></span>表格</button>
<button class="tbtn" onclick="insertBlock('image')" title="插入图片"><span data-icon="image"></span>图片</button>
<button class="tbtn" onclick="insertBlock('link')" title="插入链接"><span data-icon="link"></span>链接</button>
<button class="tbtn" onclick="insertBlock('hr')" title="插入分隔线"><span data-icon="hr"></span>分隔线</button>
<button class="tbtn" onclick="insertBlock('footnote')" title="插入脚注"><span data-icon="footnote"></span>脚注</button>
<button class="tbtn" onclick="insertBlock('toc')" title="插入目录(按标题生成)"><span data-icon="toc"></span>目录</button>
</div><div class="rg-label">插入</div></div>
<div class="rgroup"><div class="rg-body">
<button class="tbtn" onclick="insertBlock('math')" title="数学公式"><span data-icon="math"></span>数学</button>
<button class="tbtn" onclick="insertBlock('label')" title="书签(供 @[ref] 引用)"><span data-icon="bookmark"></span>书签</button>
<button class="tbtn" onclick="insertBlock('date')" title="插入日期"><span data-icon="date"></span>日期</button>
<button class="tbtn" onclick="toggleSymbolPanel(this)" title="特殊符号"><span data-icon="symbol"></span>符号</button>
</div><div class="rg-label">公式与符号</div></div>
<div class="rgroup"><div class="rg-body">
<button class="tbtn" onclick="insertBlock('quote')" title="引用块"><span data-icon="quote"></span>引用</button>
<button class="tbtn" onclick="insertBlock('comment')" title="批注(不参与渲染,仅存于源码)"><span data-icon="comment"></span>批注</button>
</div><div class="rg-label">引用与批注</div></div>
</div>
<div class="ribbon-page" data-page="view">
<div class="rgroup"><div class="rg-body">
<button class="sbtn" id="vb-display" onclick="setMode('display')">显示</button>
<button class="sbtn" id="vb-syntax" onclick="setMode('syntax')">语法</button>
<button class="sbtn" id="vb-split" onclick="setMode('split')">分屏</button>
</div><div class="rg-label">文档视图</div></div>
<div class="rgroup"><div class="rg-body">
<button class="sbtn" onclick="toggleFocus()" title="隐藏功能区/侧栏/状态栏,Esc 退出">专注模式</button>
<button class="sbtn" onclick="swapSplit()" title="分屏左右交换">左右交换</button>
<button class="sbtn" onclick="toggleSidebar()" title="显示/隐藏文档结构窗格">导航窗格</button>
</div><div class="rg-label">显示</div></div>
<div class="rgroup"><div class="rg-body">
<button class="sbtn" onclick="toggleSidebar()" title="显示/隐藏文档结构窗格">导航窗格</button>
<button class="sbtn" id="btn-marks" onclick="toggleMarks()" title="显示段落标记(¶)">编辑标记</button>
</div><div class="rg-label">显示</div></div>
<div class="rgroup"><div class="rg-body"><div class="fcol">
<div class="frow">
<select id="sel-zoom-view" title="缩放比例" style="width:84px;height:26px" onchange="applyZoom(this.value)">
<option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="custom">自定义…</option>
</select>
<input type="number" id="zoom-view-custom" min="30" max="300" step="5" style="display:none;width:60px;height:26px;border:1px solid #c9cbce;border-radius:4px;font-size:12px" title="缩放百分比 30-300" onchange="applyZoomCustom(this.value,'sel-zoom-view')">
</div>
<div style="font-size:11px;color:#8a8c90">状态栏亦可缩放</div>
</div></div><div class="rg-label">缩放</div></div>
</div>
<div class="ribbon-page" data-page="page">
<div class="rgroup"><div class="rg-body"><div class="fcol">
<div class="frow">
<select id="sel-paper" title="纸张大小" onchange="applyPaper(this.value)">
<option value="A4" selected>A4 210×297mm</option><option value="Letter">Letter 215.9×279.4mm</option><option value="B5">B5 176×250mm</option><option value="A3">A3 297×420mm</option><option value="A5">A5 148×210mm</option>
</select>
<button class="sbtn" id="btn-orient" onclick="toggleOrientation()" title="纸张方向切换">纵向</button>
</div>
<div class="frow">
<select id="sel-margin" title="页边距" onchange="applyMargin(this.value)">
<option value="20" selected>正常 20mm</option><option value="12.7">窄 12.7mm</option><option value="25.4">宽 25.4mm</option><option value="30">宽 30mm</option><option value="custom">自定义…</option>
</select>
<input type="number" id="margin-custom" min="5" max="60" step="0.5" style="display:none;width:64px;height:28px;border:1px solid #c9cbce;border-radius:4px" title="页边距 mm" onchange="applyMarginCustom(this.value)">
</div>
</div></div><div class="rg-label">纸张</div></div>
<div class="rgroup"><div class="rg-body"><div class="fcol">
<div class="frow">
<select id="sel-linesp" title="行间距" onchange="applyLineSpacing(this.value)">
<option value="1.15">单倍行距</option><option value="1.5">1.5 倍行距</option><option value="1.9" selected>默认 (1.9 倍)</option><option value="2">2 倍行距</option><option value="2.5">2.5 倍行距</option><option value="custom">自定义…</option>
</select>
<input type="number" id="linesp-custom" min="1" max="4" step="0.05" style="display:none;width:64px;height:28px;border:1px solid #c9cbce;border-radius:4px" title="行距倍数" onchange="applyLineSpacingCustom(this.value)">
</div>
<div class="frow">
<button class="sbtn" onclick="toggleFirstLine()" id="btn-firstline" title="切换首行缩进 @[first-line 2em]">首行缩进</button>
</div>
</div></div><div class="rg-label">段落设置</div></div>
</div>
<div class="ribbon-page" data-page="file">
<div class="rgroup"><div class="rg-body"><div class="frow">
<button class="tbtn" onclick="newDoc()" title="新建文档 (Ctrl+N)"><span data-icon="newdoc"></span>新建</button>
<button class="tbtn" onclick="openFileClick()" title="打开 (.awen / .txt / .md) (Ctrl+O)"><span data-icon="open"></span>打开</button>
<button class="tbtn" onclick="importDocx()" title="导入 Word 文档 (.docx)"><span data-icon="docx"></span>导入 docx</button>
<button class="tbtn" onclick="doSave()" title="保存为 Awen 源码 (Ctrl+S)"><span data-icon="save"></span>保存</button>
<button class="tbtn" onclick="doSaveAs()" title="另存为新文件"><span data-icon="savenew"></span>另存为</button>
<button class="tbtn" onclick="doPrint()" title="打印 / 另存为 PDF (Ctrl+P)"><span data-icon="print"></span>打印</button>
</div></div><div class="rg-label">文档</div></div>
<div class="rgroup"><div class="rg-body"><div class="frow">
<span style="font-size:12px;color:#5a5c60">文件名</span><input class="findbox" id="export-name" value="文档" style="width:110px">
<button class="sbtn" onclick="exportFile('md')">导出 Markdown</button>
<button class="sbtn" onclick="exportFile('html')">导出 HTML</button>
<button class="sbtn" onclick="exportFile('doc')">导出 Word</button>
<button class="sbtn" onclick="exportFile('txt')">导出 TXT</button>
<button class="sbtn" onclick="discardAutosaveDraft()" title="清空自动保存的草稿并恢复空白文档">放弃草稿</button>
</div></div><div class="rg-label">导出</div></div>
<div class="rgroup"><div class="rg-body"><div class="fcol" id="recent-list" style="min-width:180px;max-height:60px;overflow:auto"></div></div><div class="rg-label">最近文件</div></div>
</div>
</div>
<div class="workspace">
<aside class="sidebar" id="sidebar">
<div class="side-head">文档结构<button id="sb-close" onclick="toggleSidebar()" title="收起侧栏">◀</button></div>
<div class="outline" id="outline"></div>
</aside>
<button id="sb-open" onclick="toggleSidebar()" title="展开侧栏">▶</button>
<main class="pane" id="display-pane" style="flex:1 1 auto"></main>
<section class="pane" id="syntax-pane" style="display:none;flex:0 0 50%;border-left:1px solid #d7d9dc;background:#f0f1f2"></section>
</div>
<div id="tblpop"><span class="lbl">行</span><input id="tbl-rows" type="number" min="1" max="20" value="3"><span class="lbl">列</span><input id="tbl-cols" type="number" min="1" max="8" value="3"><button class="sbtn" onclick="insertTableGrid()">插入</button></div>
<div id="float-pal" class="cpalette" style="position:fixed;z-index:200"></div>
<div id="minibar">
<div class="mb-row">
<button class="rbtn b" onclick="fmtCmd('bold')" title="加粗">B</button>
<button class="rbtn i" onclick="fmtCmd('italic')" title="倾斜">I</button>
<button class="rbtn u" onclick="fmtCmd('underline')" title="下划线"><span style="text-decoration:underline">U</span></button>
<button class="rbtn s" onclick="fmtCmd('strikeThrough')" title="删除线"><span style="text-decoration:line-through">S</span></button>
<div class="sep"></div>
<button class="rbtn" onclick="togglePal(event,'fore')" title="字体颜色:点击选色"><span data-icon="fontcolor"></span></button>
<button class="rbtn" style="width:14px;font-size:9px" onclick="togglePal(event,'fore')" title="更多字体颜色">▾</button>
<button class="rbtn" onclick="togglePal(event,'mark')" title="底纹:点击选色"><span data-icon="mark"></span></button>
<button class="rbtn" style="width:14px;font-size:9px" onclick="togglePal(event,'mark')" title="更多底纹颜色">▾</button>
<div class="sep"></div>
<button class="rbtn supb" onclick="fmtCmd('superscript')" title="上标"><span>x²</span></button>
<button class="rbtn subb" onclick="fmtCmd('subscript')" title="下标"><span>x₂</span></button>
<button class="rbtn mono" onclick="fmtCmdInline()" title="行内代码">&lt;/&gt;</button>
<button class="rbtn" onclick="fmtCmd('removeFormat')" title="清除格式"><span data-icon="clear"></span></button>
</div>
<div class="mb-row" id="mb-table" style="display:none">
<button class="sbtn" onclick="tblInsRow()">+ 行</button>
<button class="sbtn" onclick="tblDelRow()">− 行</button>
<button class="sbtn" onclick="tblInsCol()">+ 列</button>
<button class="sbtn" onclick="tblDelCol()">− 列</button>
</div>
</div>
<div class="statusbar" style="gap:10px">
<span class="item" id="st-diag" style="cursor:pointer" onclick="toggleDiagPop()" title="点击查看诊断详情">诊断 ✓</span>
<span class="item" id="st-words" style="cursor:pointer" onclick="showWordCount()" title="点击查看字数统计">—</span>
<span class="item" id="st-labels" style="cursor:pointer" onclick="toggleLabelPop()" title="点击列出全部标签">Label —</span>
<span class="item" id="st-find"></span>
<span class="item" id="st-pos">第 1 页 · 行 1, 列 1</span>
<span class="spacer"></span>
<div class="statuspop" id="diagpop"></div>
<select id="sel-zoom" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:3px;height:20px;padding:0 4px" onchange="zoomEntry(this.value,'sel-zoom')">
<option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="custom">自定义…</option>
</select>
<input type="number" id="zoom-custom" min="30" max="300" step="5" style="display:none;width:64px;height:20px;border:1px solid #c9cbce;border-radius:3px;font-size:12px" title="缩放百分比 30-300" onchange="applyZoomCustom(this.value)">
<span class="item" id="st-page">共 — 页</span>
</div>
</div>
<script src="js/state.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/sync.js"></script>
<script src="js/core/caret.js"></script>
<script src="js/core/history.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/status.js"></script>
<script src="js/ui/minibar.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/palette.js"></script>
<script src="js/view/view.js"></script>
<script src="js/cmd/char.js"></script>
<script src="js/cmd/insert.js"></script>
