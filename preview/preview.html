<script>
// ═══ 状态 ═══
var docSource = '';
var syntaxPanelVisible = false;
var undoStack = [];
var redoStack = [];

// ═══ 工具函数 ═══
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtH(t) {
  let s = escHtml(t);
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  s = s.replace(/`(.+?)`/g,'<code>$1</code>');
  return s;
}

// ═══ 简化管线 ═══
function miniParse(src) {
  const lines = src.split('\n');
  const nodes = [];
  let para = [];

  for (const line of lines) {
    const t = line.trim();

    if (t === '') {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      continue;
    }
    if (t.startsWith('#')) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      const level = Math.min((t.match(/^#+/) || ['#'])[0].length, 6);
      nodes.push({kind:'heading', level: level, text: t.replace(/^#+\s*/, '')});
      continue;
    }
    if (t === '---') {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'hr', text:''});
      continue;
    }
    if (t.startsWith('- ') || t.startsWith('* ')) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'list', text:t});
      continue;
    }
    if (/^\d+\.\s/.test(t)) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'list', text:t});
      continue;
    }
    if (t.startsWith('> ')) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'quote', text:t});
      continue;
    }
    if (t.startsWith('|') && t.endsWith('|')) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'table', text:t});
      continue;
    }
    if (t.startsWith('@[comment')) {
      nodes.push({kind:'comment', text:t});
      continue;
    }
    if (/^@\[(page|margin|font|size|line-spacing|first-line|theme|toc|numbering)/.test(t)) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'docset', text:t});
      continue;
    }
    if (t.startsWith('@[') && !t.startsWith('@@')) {
      if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
      nodes.push({kind:'obj', text:t});
      continue;
    }
    para.push(t);
  }
  if (para.length > 0) { nodes.push({kind:'para', text:para.join(' ')}); para = []; }
  return nodes;
}

// ═══ 渲染 ═══
function renderDoc(nodes) {
  const paper = document.getElementById('paper');
  paper.innerHTML = '';
  let pageNum = 0;
  let lineCount = 0;
  let pd = makePage(pageNum);

  for (const node of nodes) {
    if (node.kind === 'comment' || node.kind === 'docset') continue;

    let html = '';
    if (node.kind === 'heading') {
      const tag = 'h' + Math.min(node.level, 6);
      html = '<' + tag + '>' + fmtH(node.text) + '</' + tag + '>';
    } else if (node.kind === 'para') {
      html = '<p>' + fmtH(node.text) + '</p>';
    } else if (node.kind === 'quote') {
      html = '<blockquote><p>' + fmtH(node.text.replace(/^>\s*/, '')) + '</p></blockquote>';
    } else if (node.kind === 'list') {
      const t = node.text;
      if (t.startsWith('- ') || t.startsWith('* ')) {
        html = '<ul><li>' + fmtH(t.substring(2)) + '</li></ul>';
      } else if (/^\d+/.test(t)) {
        html = '<ol><li>' + fmtH(t.replace(/^\d+\.\s*/, '')) + '</li></ol>';
      } else {
        html = '<ul><li>' + fmtH(t) + '</li></ul>';
      }
    } else if (node.kind === 'table') {
      html = '<p style="font-family:var(--mono);font-size:12px;color:#666">' + escHtml(node.text) + '</p>';
    } else if (node.kind === 'hr') {
      html = '<hr>';
    } else if (node.kind === 'obj') {
      html = '<div class="img-ph">' + escHtml(node.text) + '</div>';
    } else {
      html = '<p>' + fmtH(node.text) + '</p>';
    }

    const el = document.createElement('div');
    el.dataset.heading = node.kind === 'heading' ? node.text : '';
    el.innerHTML = html;
    pd.appendChild(el);

    lineCount++;
    if (lineCount >= 40) {
      pageNum++;
      lineCount = 0;
      pd = makePage(pageNum);
    }
  }
  paper.appendChild(pd);
  return pageNum + 1;
}

function makePage(idx) {
  const pd = document.createElement('div');
  pd.className = 'page';
  const pn = document.createElement('div');
  pn.className = 'page-no';
  pn.textContent = '第 ' + (idx+1) + ' 页';
  pd.appendChild(pn);
  return pd;
}

function renderOutlineList(nodes) {
  const ol = document.getElementById('outline');
  ol.innerHTML = '';
  for (const n of nodes) {
    if (n.kind !== 'heading') continue;
    const d = document.createElement('div');
    d.className = 'outline-item lv' + n.level;
    d.textContent = n.text;
    d.onclick = () => {
      const el = document.querySelector('[data-heading="' + n.text + '"]');
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
    ol.appendChild(d);
  }
}

function renderStatusBar(nodes, pageCount) {
  const hCount = nodes.filter(n => n.kind === 'heading').length;
  const pCount = nodes.filter(n => n.kind === 'para').length;
  document.getElementById('st-nodes').textContent = hCount + ' 标题 · ' + pCount + ' 段落';
  document.getElementById('st-page').textContent = pageCount + ' 页';
}

// ═══ 工具栏操作 ═══
function doUndo() { document.execCommand('undo'); refreshFromSource(); }
function doRedo() { document.execCommand('redo'); refreshFromSource(); }

function doWrapSel(marker) {
  const ta = document.getElementById('syntax-src');
  if (ta.style.display === 'none') return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || '文本';
  const before = ta.value.substring(0, start);
  const after = ta.value.substring(end);
  ta.value = before + marker + sel + marker + after;
  ta.selectionStart = start + marker.length;
  ta.selectionEnd = ta.selectionStart + sel.length;
  ta.focus();
  refreshFromSource();
}

function insertText(text) {
  const ta = document.getElementById('syntax-src');
  if (ta.style.display === 'none') return;
  const start = ta.selectionStart;
  ta.value = ta.value.substring(0, start) + text + ta.value.substring(ta.selectionEnd);
  ta.selectionStart = ta.selectionEnd = start + text.length;
  ta.focus();
  refreshFromSource();
}

function refreshFromSource() {
  const src = document.getElementById('syntax-src').value;
  const nodes = miniParse(src);
  renderDoc(nodes);
  renderOutlineList(nodes);
  const hCount = nodes.filter(n => n.kind === 'heading').length;
  const pCount = nodes.filter(n => n.kind === 'para').length;
  document.getElementById('st-nodes').textContent = hCount + ' 标题 · ' + pCount + ' 段落';
}
</script>
