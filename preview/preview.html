<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awen</title>
<style>
:root{
  --bg:#f3f4f6;--bg2:#fafafa;--border:#dedfe2;--border2:#d9dade;
  --fg:#24262a;--fg2:#6b6d72;--fg3:#85878b;
  --accent:#007acc;--page-w:min(820px,100%);
  --serif:Georgia,"Times New Roman","Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;
  --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --mono:"Cascadia Code","Consolas","Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:#24262a;font-size:14px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}

/* ── 布局骨架 ── */
.app{height:100vh;display:flex;flex-direction:column}
.workspace{min-height:0;flex:1;display:flex}

/* ── 标题栏 ── */
.titlebar{height:42px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px;flex:none;user-select:none}
.brand{font-weight:700;font-size:15px;letter-spacing:.3px;color:#1a1c1f}
.docname{font-size:13px;color:var(--fg2)}
.title-actions{margin-left:auto;display:flex;gap:2px}
.icon{width:30px;height:28px;border-radius:6px;display:grid;place-items:center;color:#6d7076}
.icon:hover{background:#e9eaec}

/* ── 工具栏 ── */
.toolbar{height:44px;background:#fbfbfc;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:4px;flex:none;user-select:none}
.tool{height:30px;min-width:30px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#3d3f43}
.tool:hover{background:#e8e9eb}
.tool.active{background:#dce5f0;color:var(--accent)}
.tool.bold{font-weight:700}.tool.italic{font-style:italic}.tool.strike{text-decoration:line-through}
.tool.underline{text-decoration:underline}
.sep{height:22px;width:1px;background:#ddd;margin:0 5px}
.tool-group{display:flex;gap:2px;align-items:center}
.view-tabs{margin-left:auto;display:flex;background:#e9eaec;padding:3px;border-radius:7px;gap:2px}
.view-tabs button{font-size:12px;padding:5px 12px;border-radius:5px;color:#6b6d72}
.view-tabs button.active{background:#fff;color:#222;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ── 侧栏 ── */
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
.side-head{padding:14px 14px 6px;font-size:12px;font-weight:600;color:#74777c;user-select:none}
.outline{padding:2px 8px;overflow-y:auto;flex:1}
.outline-item{padding:6px 8px;border-radius:6px;font-size:12px;color:#5d6066;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outline-item:hover{background:#ececee;color:#2d3035}
.outline-item.active{background:#e8e9eb;color:#16181b;font-weight:600}
.outline-item.lvl1{font-weight:600;color:#2d3035}
.outline-item.lvl2{padding-left:22px}
.outline-item.lvl3{padding-left:34px}
.outline-item.lvl4{padding-left:46px}
.side-bottom{margin-top:auto;border-top:1px solid #e2e3e5;padding:8px}
.side-row{font-size:12px;color:#73767b;padding:6px 8px;border-radius:6px;cursor:pointer}
.side-row:hover{background:#ececee}

/* ── 编辑区 ── */
.editor-area{min-width:0;flex:1;display:flex;flex-direction:column;background:#e8e9eb}
.tabs{height:34px;background:#f7f7f8;border-bottom:1px solid #d9dade;display:flex;align-items:flex-end;padding-left:10px;flex:none}
.tab{font-size:12px;padding:8px 14px 7px;color:#73767c;cursor:pointer}
.tab.active{background:#fff;color:#222;border:1px solid #d9dade;border-bottom:1px solid #fff;border-radius:6px 6px 0 0}
.editor-scroll{min-height:0;flex:1;overflow-y:auto;display:flex;justify-content:center;padding:28px 32px 60px}

/* ── 纸张 ── */
.paper{
  width:var(--page-w);min-height:1100px;background:#fff;position:relative;
  box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08);
  padding:72px 80px 90px;
  font-family:var(--serif);font-size:15px;line-height:1.9;color:#303238;
}
.paper .docset{font-family:var(--mono);font-size:11px;color:#b0b0b0;margin:2px 0;padding:1px 0}
.paper .docset::before{content:"◇ "}
.paper h1{font-family:var(--serif);font-size:28px;line-height:1.3;font-weight:700;color:#1a1c1f;margin:0 0 6px}
.paper .h-label{font-size:12px;color:#b0b0b0;font-family:var(--mono);vertical-align:middle;margin-left:8px}
.paper h2{font-size:18px;font-weight:700;color:#2a2c30;margin:28px 0 8px}
.paper h3{font-size:15px;font-weight:650;color:#2d3035;margin:20px 0 6px}
.paper h4,.paper h5,.paper h6{font-size:14px;font-weight:600;margin:14px 0 4px}
.paper p{margin:8px 0;text-indent:2em}
.paper p.no-indent{text-indent:0}
.paper .first-para{text-indent:0}
.paper strong{font-weight:700}
.paper em{font-style:italic}
.paper del{text-decoration:line-through;color:#999}
.paper code{font-family:var(--mono);font-size:.88em;background:#f0f1f2;padding:2px 5px;border-radius:3px}
.paper .hr-line{border:none;border-top:1px solid #ccc;margin:18px 0}
.paper blockquote{border-left:3px solid #c8cad0;padding:8px 16px;margin:12px 0;color:#5a5c60;font-size:.95em}
.paper blockquote p{text-indent:0;margin:0}
.paper .quote-lv2{margin-left:16px;border-left-color:#d8dade}
.paper .quote-lv3{margin-left:32px;border-left-color:#e0e1e4}
.paper .list{margin:6px 0;padding-left:8px}
.paper .list-item{margin:3px 0;padding-left:18px;text-indent:-18px}
.paper .list-item.ul::before{content:"• ";color:#888}
.paper .list-item.ol::before{content:counter(item) ". ";color:#888}
.paper table-wrap{margin:16px 0}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.paper table th,.paper table td{border:1px solid #d0d2d5;padding:8px 10px;text-align:left}
.paper table th{font-weight:600;background:#f5f5f6}
.paper .img-placeholder{
  width:100%;height:160px;background:#f0f1f3;border:1px dashed #c5c7ca;
  display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;margin:14px 0
}
.paper .page-break{page-break-after:always;height:0;border:none}

/* 页码 */
.paper .page-no{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-size:11px;color:#b5b7bb}

/* ── 右侧属性面板 ── */
.rightbar{width:220px;background:var(--bg2);border-left:1px solid var(--border);flex:none;padding:14px;overflow-y:auto}
.panel-title{font-size:12px;font-weight:600;margin-bottom:12px;color:#3d3f43}
.field{margin-bottom:14px}
.field-label{font-size:11px;color:var(--fg3);margin-bottom:5px;user-select:none}
.field-value{height:30px;border:1px solid #d5d7da;border-radius:6px;background:#fff;padding:6px 9px;font-size:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:#3d3f43}
.field-value:hover{border-color:#b5b7bb}
.field-value::after{content:"⌄";color:#999;font-size:10px}
.swatches{display:flex;gap:5px}
.swatch{width:22px;height:22px;border:1px solid #cfd1d4;border-radius:5px;cursor:pointer}
.swatch.active{outline:2px solid var(--accent);outline-offset:1px}

/* ── 状态栏 ── */
.statusbar{height:24px;background:var(--accent);color:#fff;display:flex;align-items:center;padding:0 14px;font-size:12px;gap:18px;flex:none}
.statusbar .item{white-space:nowrap;opacity:.9}
.statusbar .spacer{flex:1}

/* ── JSON 数据嵌入 ── */
#data{display:none}
</style>
</head>

const DATA = {"pages":2,"lines":[{"id":14,"page":0,"y":0.0,"kind":"heading","level":1,"text":"一级标题 @[label]"},{"id":15,"page":0,"y":12.805841399999998,"kind":"para","level":0,"text":"这是第一章的正文。源码中的物理换行不会产生排版换行,这仍然是一个段落。"},{"id":16,"page":0,"y":19.208762099999998,"kind":"para","level":0,"text":"空行产生新段落。"},{"id":17,"page":0,"y":25.611682799999997,"kind":"heading","level":2,"text":"二级标题 @[标签]"},{"id":18,"page":0,"y":38.41752419999999,"kind":"heading","level":3,"text":"三级标题"},{"id":19,"page":0,"y":44.820444899999984,"kind":"heading","level":4,"text":"四级标题"},{"id":20,"page":0,"y":51.22336559999998,"kind":"heading","level":5,"text":"五级标题"},{"id":21,"page":0,"y":57.626286299999975,"kind":"heading","level":6,"text":"六级标题"},{"id":22,"page":0,"y":64.02920699999997,"kind":"heading","level":2,"text":"行内格式"},{"id":23,"page":0,"y":76.83504839999996,"kind":"para","level":0,"text":"**粗体** 与 _斜体_ 与 ~~删除线~~ 与 `行内代码` 与 下划线 与 长写下划线。"},{"id":24,"page":0,"y":83.23796909999996,"kind":"para","level":0,"text":"嵌套:**粗体中嵌 _斜体_**,以及 短命令粗体 和 长命令粗体。"},{"id":25,"page":0,"y":89.64088979999995,"kind":"para","level":0,"text":"行内数学 E = mc^2 出现在段落之中。脚注演示@[footnote]。"},{"id":26,"page":0,"y":96.04381049999995,"kind":"para","level":0,"text":"链接:@[link],以及裸 URL 自动识别 https://example.com/docs。"},{"id":27,"page":0,"y":102.44673119999995,"kind":"heading","level":2,"text":"块级对象"},{"id":32,"page":0,"y":195.25257259999995,"kind":"raw","level":0,"text":"\\int_0^\\infty e^{-x}\\,dx = 1"},{"id":33,"page":0,"y":201.65549329999996,"kind":"raw","level":0,"text":"a^2 + b^2 = c^2"},{"id":34,"page":0,"y":208.05841399999997,"kind":"raw","level":0,"text":"def hello():"},{"id":34,"page":0,"y":214.46133469999998,"kind":"raw","level":0,"text":"    print(\"Hello, Awen\")  # 代码内部的 @[b] 与 ] 均不参与 Awen 解析"},{"id":35,"page":0,"y":220.8642554,"kind":"raw","level":0,"text":"raw content: }{ ] @[ ** _ ~`"},{"id":36,"page":0,"y":227.2671761,"kind":"heading","level":2,"text":"引用与列表"},{"id":37,"page":0,"y":240.07301750000002,"kind":"quote","level":0,"text":"引用:一级引用"},{"id":38,"page":0,"y":246.47593820000003,"kind":"quote","level":0,"text":"引用:二级引用"},{"id":39,"page":1,"y":0.0,"kind":"quote","level":0,"text":"引用:三级引用"},{"id":40,"page":1,"y":6.402920699999999,"kind":"list","level":0,"text":"- 无序列表项一"},{"id":40,"page":1,"y":12.805841399999998,"kind":"list","level":0,"text":"- 无序列表项二"},{"id":41,"page":1,"y":19.208762099999998,"kind":"list","level":0,"text":"1. 有序列表项一"},{"id":41,"page":1,"y":25.611682799999997,"kind":"list","level":0,"text":"2. 有序列表项二"},{"id":42,"page":1,"y":32.01460349999999,"kind":"hr","level":0,"text":"――――――――――"},{"id":43,"page":1,"y":38.41752419999999,"kind":"heading","level":2,"text":"表格 @[label]"},{"id":44,"page":1,"y":51.22336559999998,"kind":"para","level":0,"text":"简单表格:"},{"id":45,"page":1,"y":57.626286299999975,"kind":"table","level":0,"text":"| 方法 | 速度 | 安全性 |"},{"id":45,"page":1,"y":64.02920699999997,"kind":"table","level":0,"text":"| A | 0.21 | 低 |"},{"id":45,"page":1,"y":70.43212769999997,"kind":"table","level":0,"text":"| B | 0.48 | 中 |"},{"id":46,"page":1,"y":76.83504839999996,"kind":"para","level":0,"text":"复杂单元格 @[label]:"},{"id":47,"page":1,"y":83.23796909999996,"kind":"table","level":0,"text":"| 姓名 | 备注 |"},{"id":47,"page":1,"y":89.64088979999995,"kind":"table","level":0,"text":"| \"Smith, John\" | 单元格含逗号无需转义 |"},{"id":47,"page":1,"y":96.04381049999995,"kind":"table","level":0,"text":"| A | 合并单元格 |"},{"id":47,"page":1,"y":102.44673119999995,"kind":"table","level":0,"text":"| 粗 | code 与 a+b |"},{"id":48,"page":1,"y":108.84965189999994,"kind":"para","level":0,"text":"表格引用:见 @[ref]。"},{"id":49,"page":1,"y":115.25257259999994,"kind":"heading","level":2,"text":"样式与全角输入"},{"id":50,"page":1,"y":128.05841399999994,"kind":"para","level":0,"text":"彩色文字。"},{"id":51,"page":1,"y":134.46133469999995,"kind":"para","level":0,"text":"局部字体 与 局部字号。"},{"id":52,"page":1,"y":140.86425539999996,"kind":"para","level":0,"text":"全角输入:“微软雅黑” ,以及 @[字体] 与 @[大小] 与 @[图片] 均为合法中文方言。"},{"id":53,"page":1,"y":147.26717609999997,"kind":"para","level":0,"text":"混合方言:同一文档允许中文语法、英文语法、短命令、长命令并存(规范 §6.14)。"},{"id":54,"page":1,"y":153.67009679999998,"kind":"heading","level":2,"text":"转义演示"},{"id":55,"page":1,"y":166.4759382,"kind":"para","level":0,"text":"# 不是标题**不是粗体**_不是斜体_~~不是删除线~~- 不是列表> 不是引用`不是代码`1. 不是有序"},{"id":55,"page":1,"y":172.8788589,"kind":"para","level":0,"text":"列表@[image hero] 按字面显示@[comment 这是正文中的示例] 按字面显示"},{"id":56,"page":1,"y":179.28177960000002,"kind":"heading","level":2,"text":"交叉引用"},{"id":57,"page":1,"y":192.08762100000004,"kind":"para","level":0,"text":"参见章节 @[ref],图片 @[ref],以及二级标题 @[ref]。"}],"anchors":[{"label":"chapter-intro","page":0},{"label":"二级示例","page":0},{"label":"hero.png","page":0},{"label":"架构图","page":0},{"label":"result-table-section","page":1}],"outline":[{"level":1,"text":"一级标题 @[label]","id":14},{"level":2,"text":"二级标题 @[标签]","id":17},{"level":3,"text":"三级标题","id":18},{"level":4,"text":"四级标题","id":19},{"level":5,"text":"五级标题","id":20},{"level":6,"text":"六级标题","id":21},{"level":2,"text":"行内格式","id":22},{"level":2,"text":"块级对象","id":27},{"level":2,"text":"引用与列表","id":36},{"level":2,"text":"表格 @[label]","id":43},{"level":2,"text":"样式与全角输入","id":49},{"level":2,"text":"转义演示","id":54},{"level":2,"text":"交叉引用","id":56}]};

// ── 渲染 ──
function render(data) {
  const paper = document.getElementById('paper');
  paper.innerHTML = '';

  // 按页分组
  const pages = {};
  for (const line of data.lines) {
    if (!pages[line.page]) pages[line.page] = [];
    pages[line.page].push(line);
  }
  const pageIdx = Object.keys(pages).map(Number).sort((a,b)=>a-b);

  // 渲染每页
  for (const pi of pageIdx) {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'page-content';

    for (const line of pages[pi]) {
      const el = document.createElement('div');
      el.className = 'line-' + line.id;
      el.dataset.nodeId = line.id;

      if (line.kind === 'heading') {
        const tag = 'h' + Math.min(line.level, 6);
        el.innerHTML = `<${tag}>${fmtHtml(line.text)}</${tag}>`;
      } else if (line.kind === 'para') {
        el.innerHTML = `<p>${fmtHtml(line.text)}</p>`;
      } else if (line.kind === 'quote') {
        el.innerHTML = `<blockquote><p>${fmtHtml(line.text)}</p></blockquote>`;
      } else if (line.kind === 'list') {
        el.innerHTML = `<div class="list-item">${fmtHtml(line.text)}</div>`;
      } else if (line.kind === 'table') {
        el.innerHTML = `<p style="font-family:var(--mono);font-size:12px;color:#666">${escHtml(line.text)}</p>`;
      } else if (line.kind === 'hr') {
        el.innerHTML = '<hr class="hr-line">';
      } else if (line.kind === 'raw') {
        el.innerHTML = `<p style="font-family:var(--mono);font-size:12px;color:#444">${escHtml(line.text)}</p>`;
      } else if (line.kind === 'obj') {
        el.innerHTML = `<div class="img-placeholder">🖼 ${escHtml(line.text)}</div>`;
      } else if (line.kind === 'comment') {
        continue;
      } else if (line.kind === 'docset') {
        continue;
      } else {
        el.innerHTML = `<p>${escHtml(line.text)}</p>`;
      }
      pageDiv.appendChild(el);
    }

    // 页码
    const pn = document.createElement('div');
    pn.className = 'page-no';
    pn.textContent = pi + 1;
    pageDiv.appendChild(pn);
    paper.appendChild(pageDiv);
  }

  // 大纲
  const ol = document.getElementById('outline');
  ol.innerHTML = '';
  for (const o of (data.outline || [])) {
    const d = document.createElement('div');
    d.className = 'outline-item lvl' + o.level;
    d.textContent = o.text;
    d.onclick = () => {
      const el = document.querySelector(`[data-node-id="${o.id}"]`);
      if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
    };
    ol.appendChild(d);
  }

  // 锚点
  const anchorList = (data.anchors || []).map(a => `${a.label} → 第${a.page + 1}页`).join(', ');

  // 状态栏
  document.getElementById('st-errors').textContent = '诊断 ' + (data.errors || 0);
  document.getElementById('st-nodes').textContent = (data.lines || []).length + ' 行';
  document.getElementById('st-labels').textContent = 'Label ' + (data.anchors || []).length;
  document.getElementById('st-page').textContent = '共 ' + data.pages + ' 页';
}

function fmtHtml(text) {
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  s = s.replace(/`(.+?)`/g, '<code>$1</code>');
  s = s.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');
  return s;
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

render(DATA);
</script>
