<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awen</title>
<style>
:root{--serif:Georgia,"Times New Roman","Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;--sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;--mono:"Cascadia Code","Consolas",monospace;--bg:#f3f4f6;--bg2:#fafafa;--bg3:#f7f7f8;--border:#dedfe2;--border2:#d9dade;--fg2:#6b6d72;--accent:#4b6f8d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:#24262a;font-size:14px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column}
.titlebar{height:40px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px;flex:none;user-select:none}
.brand{font-weight:700;font-size:15px;color:#1a1c1f}
.docname{font-size:13px;color:var(--fg2)}
.toolbar{height:42px;background:var(--bg3);border-bottom:1px solid var(--border2);display:flex;align-items:center;padding:0 12px;gap:4px;flex:none;user-select:none;overflow-x:auto}
.tbtn{height:28px;min-width:28px;padding:0 7px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#3d3f43;white-space:nowrap;flex:none}
.tbtn:hover{background:#e8e9eb}
.tbtn.bold{font-weight:700}.tbtn.italic{font-style:italic}.tbtn.strike{text-decoration:line-through}
.tsep{height:20px;width:1px;background:#ddd;margin:0 4px;flex:none}
.view-tabs{margin-left:auto;display:flex;background:#e9eaec;padding:3px;border-radius:7px;gap:2px;flex:none}
.view-tabs button{font-size:12px;padding:4px 12px;border-radius:5px;color:#6b6d72}
.view-tabs button.active{background:#fff;color:#222;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.workspace{min-height:0;flex:1;display:flex;overflow:hidden}
.sidebar{width:210px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none;overflow:hidden}
.side-head{padding:12px 14px 6px;font-size:12px;font-weight:600;color:#74777c;user-select:none}
.outline{flex:1;overflow-y:auto;padding:2px 8px}
.outline-item{padding:6px 8px;border-radius:6px;font-size:12px;color:#5d6066;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.outline-item:hover{background:#ececee;color:#2d3035}
.outline-item.lv1{font-weight:600;color:#2d3035}
.outline-item.lv2{padding-left:20px}
.outline-item.lv3{padding-left:32px}
.outline-item.lv4{padding-left:44px}
.editor-area{min-width:0;flex:1;display:flex;flex-direction:column;background:#e8e9eb;overflow:hidden}
.editor-scroll{min-height:0;flex:1;overflow-y:auto;display:flex;justify-content:center;padding:28px 32px 60px}
.paper{width:min(820px,100%);min-height:1100px;background:#fff;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.06);padding:72px 80px 90px;font-family:var(--serif);font-size:15px;line-height:1.9;color:#303238}
.paper .docset{font-family:var(--mono);font-size:10px;color:#c8cad0;margin:1px 0;user-select:none}
.paper h1{font-size:28px;line-height:1.3;font-weight:700;color:#1a1c1f;margin:0 0 6px}
.paper h2{font-size:18px;font-weight:700;color:#2a2c30;margin:28px 0 8px}
.paper h3{font-size:15px;font-weight:650;color:#2d3035;margin:20px 0 6px}
.paper h4{font-size:14px;font-weight:600;margin:14px 0 4px}
.paper h5{font-size:13px;font-weight:600;margin:12px 0 4px}
.paper h6{font-size:12px;font-weight:600;margin:10px 0 2px;color:#888}
.paper p{margin:8px 0;text-indent:2em}
.paper strong{font-weight:700}
.paper em{font-style:italic}
.paper del{text-decoration:line-through;color:#999}
.paper code{font-family:var(--mono);font-size:.87em;background:#f0f1f2;padding:1px 5px;border-radius:3px}
.paper hr{border:none;border-top:1px solid #ccc;margin:18px 0}
.paper blockquote{border-left:3px solid #c8cad0;padding:8px 16px;margin:12px 0;color:#5a5c60;font-size:.95em}
.paper blockquote p{text-indent:0;margin:0}
.paper ul,.paper ol{margin:6px 0;padding-left:8px;list-style:none}
.paper ul li,.paper ol li{margin:3px 0;padding-left:20px;text-indent:-20px}
.paper ul li::before{content:"• ";color:#999}
.paper table{width:100%;border-collapse:collapse;font-size:13px;margin:16px 0}
.paper table th,.paper table td{border:1px solid #d0d2d5;padding:8px 10px;text-align:left}
.paper table th{font-weight:600;background:#f5f5f6}
.paper .img-ph{width:100%;height:160px;background:#f0f1f3;border:1px dashed #c5c7ca;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;margin:14px 0}
.pageblock{position:relative;padding-bottom:40px}
.page-no{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#b5b7bb}
.syntax-panel{display:none;min-width:0;flex:0 0 50%;background:#fff;border-left:1px solid #d7d9dc;overflow:hidden;flex-direction:column}
.syntax-panel.visible{display:flex}
.syntax-header{height:36px;border-bottom:1px solid #e0e1e4;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;color:#666;flex:none}
.syntax-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
.syntax-editor textarea{flex:1;resize:none;border:0;outline:0;padding:20px 24px;font:13px/1.75 var(--mono);color:#303238;background:#fff;tab-size:2}
.statusbar{height:24px;background:var(--accent);color:#fff;display:flex;align-items:center;padding:0 14px;font-size:12px;gap:16px;flex:none}
.statusbar .item{white-space:nowrap;opacity:.9}
.statusbar .spacer{flex:1}
</style>
</head>
<body>
<div class="app">
<div class="titlebar">
<div class="brand">Awen</div>
<div class="docname" id="docname">未命名文档</div>
<div style="margin-left:auto;display:flex;gap:8px">
<button class="tbtn" onclick="doSave()">保存</button>
</div>
</div>
<div class="toolbar">
<button class="tbtn" onclick="doUndo()" title="撤销 (Ctrl+Z)">↩ 撤销</button>
<button class="tbtn" onclick="doRedo()" title="重做 (Ctrl+Y)">↪ 重做</button>
<div class="tsep"></div>
<button class="tbtn bold" onclick="doWrap('**')" title="粗体"><b>B</b></button>
<button class="tbtn italic" onclick="doWrap('_')" title="斜体"><i>I</i></button>
<button class="tbtn strike" onclick="doWrap('~~')" title="删除线"><s>S</s></button>
<button class="tbtn" onclick="doWrap('`')" title="行内代码">`</button>
<div class="tsep"></div>
<button class="tbtn" onclick="insertText('\n\n---\n\n')">─ 分隔线</button>
<button class="tbtn" onclick="insertText('\n\n> 引用内容\n\n')">❝ 引用</button>
<button class="tbtn" onclick="insertText('\n\n@[image hero.png]\n\n')">🖼 图片</button>
<button class="tbtn" onclick="insertText('\n\n@[table]\n\n| 列1 | 列2 |\n| --- | --- |\n| 内容 | 内容 |\n\n@[/table]\n\n')">▦ 表格</button>
<div class="view-tabs">
<button class="active" data-mode="display">显示</button>
<button data-mode="syntax">语法</button>
<button data-mode="split">分屏</button>
</div>
</div>
<div class="workspace">
<aside class="sidebar">
<div class="side-head">文档结构</div>
<div class="outline" id="outline"></div>
</aside>
<main class="editor-area" id="editor-area">
<div class="editor-scroll"><article class="paper" id="paper"></article></div>
</main>
<section class="syntax-panel" id="syntax-panel">
<div class="syntax-header"><span>Awen 语法</span><span>中文语法</span></div>
<div class="syntax-editor"><textarea id="syntax-src" spellcheck="false"></textarea></div>
</section>
</div>
<div class="statusbar">
<span class="item" id="st-diag">诊断 ✓</span>
<span class="item" id="st-nodes">—</span>
<span class="item" id="st-labels">Label —</span>
<span class="spacer"></span>
<span class="item" id="st-page">—</span>
</div>
</div>
<script>
// ── 数据通道:generate_preview.aine 将 /*__JSON__*/{} 替换为核心渲染 JSON ──
var DOC_DATA = /*__JSON__*/{};
var DEFAULT_SRC = '# Awen 编辑器\n\n这是一段示例文本。选中文字后点击 **B** 可以加粗。\n\n## 二级标题\n\n第二段内容,在这里输入文字会实时更新预览。\n\n- 列表项一\n- 列表项二\n\n> 引用示例\n';

// ── 工具 ──
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmtH(t){let s=escHtml(t);s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');s=s.replace(/_(.+?)_/g,'<em>$1</em>');s=s.replace(/`(.+?)`/g,'<code>$1</code>');return s}

// ── 解析:块级 ──
function miniParse(src){
  const lines=src.split('\n');
  const nodes=[];
  let para=[];
  const flush=()=>{if(para.length>0){nodes.push({kind:'para',text:para.join(' ')});para=[]}};
  for(const line of lines){
    const t=line.trim();
    if(t===''){flush();continue}
    if(t.startsWith('#')){
      flush();
      const lvl=Math.min((t.match(/^#+/)||['#'])[0].length,6);
      nodes.push({kind:'heading',level:lvl,text:t.replace(/^#+\s*/,'')});
      continue;
    }
    if(t==='---'){flush();nodes.push({kind:'hr',text:''});continue}
    if(t.startsWith('- ')||t.startsWith('* ')){flush();nodes.push({kind:'list',text:t.replace(/^[-*]\s*/,'')});continue}
    if(/^\d+\.\s/.test(t)){flush();nodes.push({kind:'list',text:t.replace(/^\d+\.\s*/,''),ordered:true});continue}
    if(t.startsWith('> ')){flush();nodes.push({kind:'quote',text:t.replace(/^>\s*/,'')});continue}
    if(t.startsWith('|')&&t.endsWith('|')){flush();nodes.push({kind:'trow',text:t});continue}
    if(t.startsWith('@[comment')){nodes.push({kind:'comment',text:t});continue}
    if(/^@\[(page|margin|font|size|line-spacing|first-line|theme|toc|numbering)/.test(t)){flush();nodes.push({kind:'docset',text:t});continue}
    if(t.startsWith('@[')&&!t.startsWith('@@')){flush();nodes.push({kind:'obj',text:t});continue}
    para.push(t);
  }
  flush();
  return nodes;
}

// ── 表格行收集:连续 trow 合并为 table ──
function collectTables(nodes){
  const out=[];
  let rows=[];
  const flushT=()=>{
    if(rows.length===0)return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    let html='<table>';
    for(let i=0;i<rows.length;i++){
      const cs=cells(rows[i]);
      if(cs.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      html+='<tr>'+cs.map(c=>(i===0?'<th>':'<td>')+fmtH(c)+(i===0?'</th>':'</td>')).join('')+'</tr>';
    }
    html+='</table>';
    out.push({kind:'rawhtml',html:html});
    rows=[];
  };
  for(const n of nodes){
    if(n.kind==='trow'){rows.push(n.text);continue}
    flushT();
    out.push(n);
  }
  flushT();
  return out;
}

// ── 渲染 ──
const PAGE_LINES=42;
function renderDoc(nodes){
  const paper=document.getElementById('paper');
  paper.innerHTML='';
  let pageNum=0,lineCount=0;
  let block=document.newPageBlock(0);
  for(const node of nodes){
    if(node.kind==='comment'||node.kind==='docset')continue;
    let weight=1,html='';
    if(node.kind==='heading'){const tag='h'+Math.min(node.level,6);html='<'+tag+'>'+fmtH(node.text)+'</'+tag+'>';weight=node.level<=2?3:2}
    else if(node.kind==='para'){html='<p>'+fmtH(node.text)+'</p>'}
    else if(node.kind==='quote'){html='<blockquote><p>'+fmtH(node.text)+'</p></blockquote>'}
    else if(node.kind==='list'){html=(node.ordered?'<ol>':'<ul>')+'<li>'+fmtH(node.text)+'</li>'+(node.ordered?'</ol>':'</ul>');weight=1.5}
    else if(node.kind==='rawhtml'){html=node.html;weight=4}
    else if(node.kind==='hr'){html='<hr>';weight=3}
    else if(node.kind==='obj'){html='<div class="img-ph">'+escHtml(node.text)+'</div>';weight=8}
    else{html='<p>'+fmtH(node.text)+'</p>'}
    const el=document.createElement('div');
    if(node.kind==='heading')el.dataset.heading=node.text;
    el.innerHTML=html;
    block.appendChild(el);
    lineCount+=weight;
    if(lineCount>=PAGE_LINES){pageNum++;lineCount=0;block=document.newPageBlock(pageNum);paper.appendChild(block)}
  }
  paper.appendChild(block);
  return pageNum+1;
}
// 分页块:每满一页开新块,页脚显示页码
document.newPageBlock=function(idx){
  const pd=document.createElement('div');
  pd.className='pageblock';
  const pn=document.createElement('div');
  pn.className='page-no';
  pn.textContent='— '+(idx+1)+' —';
  pd.appendChild(pn);
  return pd;
};

function renderOutline(nodes){
  const ol=document.getElementById('outline');
  ol.innerHTML='';
  for(const n of nodes){
    if(n.kind!=='heading')continue;
    const d=document.createElement('div');
    d.className='outline-item lv'+n.level;
    d.textContent=n.text;
    d.onclick=function(){
      const el=document.querySelector('#paper [data-heading]');
      const all=document.querySelectorAll('#paper [data-heading]');
      for(const e of all){if(e.textContent===n.text){e.scrollIntoView({behavior:'smooth',block:'start'});return}}
    };
    ol.appendChild(d);
  }
}

// ── 主刷新 ──
function refresh(){
  const src=getSrc();
  let nodes=miniParse(src);
  nodes=collectTables(nodes);
  const pages=renderDoc(nodes);
  renderOutline(nodes);
  let labels=0;
  for(const n of nodes){if(n.kind==='obj'&&n.text.indexOf('label')>=0)labels++}
  document.getElementById('st-nodes').textContent=nodes.length+' 节点';
  document.getElementById('st-page').textContent=pages+' 页';
  document.getElementById('st-labels').textContent='Label '+labels;
}

// ── 编辑器访问 ──
function getSrc(){return document.getElementById('syntax-src').value}
function setSrc(s,caret){
  const ta=document.getElementById('syntax-src');
  ta.value=s;
  if(caret!==undefined){ta.selectionStart=ta.selectionEnd=caret}
  refresh();
}

// ── Undo/Redo(自维护历史栈;500ms 内连续输入合并为一步)──
var hist=[],histIdx=-1,histTime=0;
function recordHist(text, merge){
  const now=Date.now();
  if(merge&&histIdx>=0&&now-histTime<500){
    hist[histIdx]={text:text,caret:0};
    histTime=now;
    return;
  }
  hist=hist.slice(0,histIdx+1);
  hist.push({text:text,caret:0});
  if(hist.length>300)hist.shift();
  histIdx=hist.length-1;
  histTime=now;
}
function doUndo(){
  if(histIdx<=0)return;
  histIdx--;
  setSrc(hist[histIdx].text);
  syncStatus();
}
function doRedo(){
  if(histIdx>=hist.length-1)return;
  histIdx++;
  setSrc(hist[histIdx].text);
  syncStatus();
}
function syncStatus(){
  document.getElementById('st-diag').textContent='诊断 ✓ · 历史 '+histIdx+'/'+(hist.length-1);
}

// ── 编辑操作 ──
function insertText(text){
  const ta=document.getElementById('syntax-src');
  const s=ta.selectionStart;
  // 只在光标处插入,不吞掉选中文本
  ta.value=ta.value.substring(0,s)+text+ta.value.substring(s);
  ta.focus();
  ta.selectionStart=ta.selectionEnd=s+text.length;
  recordHist(ta.value,false);
  refresh();
}
function doWrap(marker){
  const ta=document.getElementById('syntax-src');
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e);
  ta.focus();
  if(sel.length===0){
    const ph='文本';
    ta.value=ta.value.substring(0,s)+marker+ph+marker+ta.value.substring(e);
    ta.selectionStart=s+marker.length;
    ta.selectionEnd=s+marker.length+ph.length;
  }else{
    // 已包裹则解除,否则包裹
    const before=ta.value.substring(0,s);
    const after=ta.value.substring(e);
    if(before.endsWith(marker)&&after.startsWith(marker)){
      ta.value=before.substring(0,before.length-marker.length)+sel+after.substring(marker.length);
      ta.selectionStart=s-marker.length;
      ta.selectionEnd=s-marker.length+sel.length;
    }else{
      ta.value=before+marker+sel+marker+after;
      ta.selectionStart=s+marker.length;
      ta.selectionEnd=s+marker.length+sel.length;
    }
  }
  recordHist(ta.value,false);
  refresh();
}
function doSave(){
  const blob=new Blob([getSrc()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='document.awen.txt';
  a.click();
  document.getElementById('docname').textContent='未命名文档 · 已保存';
}

// ── 视图切换 ──
var modeBtns=document.querySelectorAll('.view-tabs button');
for(var i=0;i<modeBtns.length;i++){
  (function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})})(modeBtns[i]);
}
function setMode(mode){
  for(var i=0;i<modeBtns.length;i++){modeBtns[i].classList.toggle('active',modeBtns[i].dataset.mode===mode)}
  const dp=document.getElementById('editor-area');
  const sp=document.getElementById('syntax-panel');
  if(mode==='syntax'){dp.style.display='none';dp.style.flex='none';sp.style.display='flex';sp.style.flex='1 1 auto'}
  else if(mode==='split'){dp.style.display='flex';dp.style.flex='1 1 50%';sp.style.display='flex';sp.style.flex='1 1 50%'}
  else{dp.style.display='flex';dp.style.flex='1 1 auto';sp.style.display='none'}
}

// ── textarea 输入 → 防抖刷新 ──
var debounce=null;
document.getElementById('syntax-src').addEventListener('input',function(){
  recordHist(this.value,true);
  syncStatus();
  if(debounce)clearTimeout(debounce);
  debounce=setTimeout(refresh,200);
});
document.getElementById('syntax-src').addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='Z'&&e.shiftKey))){e.preventDefault();doRedo()}
  else if(e.key==='Tab'){e.preventDefault();insertText('  ')}
});

// ── 初始化:优先用核心渲染通道注入的源码 ──
(function init(){
  let src=DEFAULT_SRC;
  if(DOC_DATA&&DOC_DATA.source){src=DOC_DATA.source}
  setSrc(src);
  recordHist(src,false);
  syncStatus();
})();
</script>
</body>
</html>
