<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awen</title>
<style>
:root{--serif:Georgia,"Times New Roman","Noto Serif SC","Source Han Serif SC","Microsoft YaHei",serif;--sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;--mono:"Cascadia Code","Consolas",monospace;--bg:#e8e9eb;--bg2:#fafafa;--bg3:#f7f7f8;--border:#dedfe2;--border2:#d9dade;--fg2:#6b6d72;--accent:#4b6f8d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:#24262a;font-size:14px}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
select{font:inherit;border:1px solid #c9cbce;border-radius:4px;background:#fff;padding:4px 5px;font-size:12px;color:#303238;outline:none;cursor:pointer;max-width:110px}
input[type=color]{width:26px;height:24px;border:1px solid #c9cbce;border-radius:4px;background:#fff;padding:1px;cursor:pointer}
input.findbox{border:1px solid #c9cbce;border-radius:4px;padding:4px 6px;font-size:12px;outline:none;width:110px}
.app{height:100vh;display:flex;flex-direction:column}
.titlebar{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px;flex:none;user-select:none}
.brand{font-weight:700;font-size:15px;color:#1a1c1f}
.docname{font-size:13px;color:var(--fg2)}
/* ── Word/WPS 风格功能区:图标+中文标签,分组带组名 ── */
.ribbon{background:var(--bg3);border-bottom:1px solid var(--border2);flex:none;user-select:none}
.ribbon-row{display:flex;align-items:stretch;padding:2px 8px 0;gap:0;overflow-x:auto}
.rgroup{display:flex;flex-direction:column;padding:2px 6px 0;border-right:1px solid #e0e1e4;flex:none}
.rg-body{display:flex;gap:1px;align-items:stretch;flex:1}
.rg-label{font-size:10px;color:#8a8c90;text-align:center;padding:2px 0 3px;line-height:1}
.rbtn{min-width:40px;padding:3px 5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:4px;color:#303238}
.rbtn:hover{background:#e6e7e9}
.rbtn:active{background:#dcdde0}
.rbtn .ic{font-size:15px;line-height:1.1;font-family:var(--sans)}
.rbtn .rl{font-size:10px;color:#4d4f53;line-height:1;white-space:nowrap}
.rbtn.tall{height:100%}
.rbtn.b .ic{font-weight:700}.rbtn.i .ic{font-style:italic}.rbtn.u .ic{text-decoration:underline}.rbtn.s .ic{text-decoration:line-through}
.rbtn.small .ic{font-size:13px}
.rcol{display:flex;flex-direction:column;gap:1px}
.rrow{display:flex;gap:1px}
.rbtn.half{min-width:44px;padding:2px 4px 1px}
.rbtn.half .ic{font-size:13px}
.rbtn.half .rl{font-size:10px}
.vsel{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:2px 4px}
.view-tabs{margin-left:auto;display:flex;align-items:center;padding:0 6px;gap:2px;flex:none}
.view-tabs button{font-size:12px;padding:5px 14px;border-radius:5px;color:#6b6d72}
.view-tabs button.active{background:#fff;color:#222;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.workspace{min-height:0;flex:1;display:flex;overflow:hidden}
.sidebar{width:180px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none;overflow:hidden}
.side-head{padding:12px 14px 6px;font-size:12px;font-weight:600;color:#74777c;user-select:none}
.outline{flex:1;overflow-y:auto;padding:2px 8px}
.outline-item{padding:5px 8px;border-radius:6px;font-size:12px;color:#5d6066;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.outline-item:hover{background:#ececee;color:#2d3035}
.outline-item.lv1{font-weight:600;color:#2d3035}
.outline-item.lv2{padding-left:18px}
.outline-item.lv3{padding-left:30px}
.outline-item.lv4{padding-left:42px}
.pane{min-width:0;flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:24px 0 80px;gap:16px}
.sheet{width:210mm;min-height:297mm;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.08);padding:20mm;position:relative;flex:none}
.sheet .folio{position:absolute;bottom:8mm;left:0;right:0;text-align:center;font-size:9pt;color:#b5b7bb;font-family:var(--sans)}
.paper{font-family:var(--serif);font-size:11pt;line-height:1.9;color:#303238;line-break:strict;outline:none}
.paper [data-bid]{position:relative}
.paper [data-bid]:focus-within{background:rgba(75,111,141,.04)}
.paper .gap{height:0.55em}
.paper h1{font-size:22pt;line-height:1.4;font-weight:700;color:#1a1c1f}
.paper h2{font-size:15pt;font-weight:700;color:#2a2c30}
.paper h3{font-size:13pt;font-weight:650;color:#2d3035}
.paper h4{font-size:12pt;font-weight:600}
.paper h5{font-size:11pt;font-weight:600}
.paper h6{font-size:10.5pt;font-weight:600;color:#888}
.paper p{margin:0}
.paper strong,.paper b{font-weight:700}
.paper em,.paper i{font-style:italic}
.paper del,.paper s,.paper strike{text-decoration:line-through;color:#999}
.paper u{text-decoration:underline}
.paper code{font-family:var(--mono);font-size:.87em;background:#f0f1f2;padding:1px 4px;border-radius:3px}
.paper hr{border:none;border-top:1px solid #ccc;margin:.8em 0}
.paper blockquote{border-left:3px solid #c8cad0;padding:2px 14px;color:#5a5c60;font-size:.95em}
.paper ul,.paper ol{margin:0;padding-left:2.4em}
.paper table{width:100%;border-collapse:collapse;font-size:10.5pt}
.paper table th,.paper table td{border:1px solid #d0d2d5;padding:4px 8px;text-align:left;vertical-align:top}
.paper table th{font-weight:600;background:#f5f5f6}
.paper .img-ph{width:100%;height:32mm;background:#f0f1f3;border:1px dashed #c5c7ca;display:flex;align-items:center;justify-content:center;color:#999;font-size:10pt}
.paper .docset{font-family:var(--mono);font-size:8pt;color:#c8cad0;user-select:none}
.paper .comment-src{background:#fffbe8;color:#b09a3e;font-family:var(--mono);font-size:9pt;border-radius:3px;padding:0 4px}
.statusbar{height:24px;background:var(--accent);color:#fff;display:flex;align-items:center;padding:0 14px;font-size:12px;gap:16px;flex:none}
.statusbar .item{white-space:nowrap;opacity:.9}
.statusbar .spacer{flex:1}
</style>
</head>
<body>
<div class="app">
<div class="titlebar">
<div class="brand">Awen</div>
<div class="docname" id="docname">未命名文档</div>
<div style="margin-left:auto"><button class="rbtn" style="flex-direction:row" onclick="doSave()" title="保存 (Ctrl+S)"><span class="ic">💾</span><span class="rl">保存</span></button></div>
</div>
<div class="ribbon">
<div class="ribbon-row">
<div class="rgroup"><div class="rg-body">
<button class="rbtn" onclick="doUndo()" title="撤销 (Ctrl+Z)"><span class="ic">↩</span><span class="rl">撤销</span></button>
<button class="rbtn" onclick="doRedo()" title="重做 (Ctrl+Y)"><span class="ic">↪</span><span class="rl">重做</span></button>
</div><div class="rg-label">剪贴板</div></div>
<div class="rgroup"><div class="rg-body"><div class="vsel">

<option value="" selected>正文</option><option value="1">标题 1</option><option value="2">标题 2</option><option value="3">标题 3</option><option value="4">标题 4</option><option value="5">标题 5</option><option value="6">标题 6</option>
</select>

<option value="" selected>宋体</option><option value="SimSun">宋体</option><option value="SimHei">黑体</option><option value="KaiTi">楷体</option><option value="FangSong">仿宋</option><option value="Microsoft YaHei">微软雅黑</option><option value="DengXian">等线</option>
</select>
<select id="sel-size" title="字号" onchange="applySize(this.value)">
<option value="" selected>五号 10.5</option><option value="9">小五 9</option><option value="10.5">五号 10.5</option><option value="11">11 号</option><option value="12">小四 12</option><option value="14">四号 14</option><option value="16">三号 16</option><option value="18">二号 18</option><option value="22">一号 22</option>
</select>
</div></div><div class="rg-label">字体</div></div>
<div class="rgroup"><div class="rg-body"><div class="rrow">
<button class="rbtn b" onclick="fmtCmd('bold')" title="加粗 (Ctrl+B)"><span class="ic">B</span><span class="rl">加粗</span></button>
<button class="rbtn i" onclick="fmtCmd('italic')" title="倾斜 (Ctrl+I)"><span class="ic">I</span><span class="rl">倾斜</span></button>
<button class="rbtn u" onclick="fmtCmd('underline')" title="下划线 (Ctrl+U)"><span class="ic">U</span><span class="rl">下划线</span></button>

<button class="rbtn s" onclick="fmtCmd('strikeThrough')" title="删除线"><span class="ic">S</span><span class="rl">删除线</span></button>

<button class="rbtn small" onclick="fmtCmd('removeFormat')" title="清除所选格式"><span class="ic">🧹</span><span class="rl">清除格式</span></button>
</div></div><div class="rg-label">字体样式</div></div>
<div class="rgroup"><div class="rg-body"><div class="rrow">
<span style="display:flex;flex-direction:column;align-items:center;padding:2px 4px" title="字体颜色"><input type="color" id="col-fore" value="#c0392b" onchange="applyColor(this.value)" style="width:26px"><span class="rl" style="font-size:10px;color:#4d4f53">字体颜色</span></span>
<span style="display:flex;flex-direction:column;align-items:center;padding:2px 4px" title="文字底纹"><input type="color" id="col-mark" value="#fff176" onchange="applyMark(this.value)" style="width:26px"><span class="rl" style="font-size:10px;color:#4d4f53">底纹</span></span>

<div class="rgroup"><div class="rg-body"><div class="rcol">

<button class="rbtn half" onclick="listCmd('ul')" title="项目符号列表"><span class="ic">≣•</span><span class="rl">项目符号</span></button>
<button class="rbtn half" onclick="listCmd('ol')" title="编号列表"><span class="ic">≡1</span><span class="rl">编号</span></button>

<div class="rrow">
<button class="rbtn half" onclick="fmtCmd('justifyLeft')" title="左对齐"><span class="ic">⯇</span><span class="rl">左对齐</span></button>

<button class="rbtn half" onclick="fmtCmd('justifyRight')" title="右对齐"><span class="ic">⯈</span><span class="rl">右对齐</span></button>

</div><div class="rcol">
<div class="rrow">
<button class="rbtn half" onclick="insertBlock('hr')" title="插入分隔线"><span class="ic">─</span><span class="rl">分隔线</span></button>

<div class="rrow">

<button class="rbtn half" onclick="insertBlock('footnote')" title="插入脚注"><span class="ic">*¹</span><span class="rl">脚注</span></button>
</div>
</div></div><div class="rg-label">段落</div></div>
<div class="rgroup"><div class="rg-body">
<button class="rbtn" onclick="insertBlock('comment')" title="批注不参与渲染,仅存于源码"><span class="ic">💬</span><span class="rl">批注</span></button>
<button class="rbtn" onclick="toggleFind()" title="查找 (Ctrl+F)"><span class="ic">🔍</span><span class="rl">查找</span></button>
<input class="findbox" id="findbox" placeholder="查找内容" style="display:none" onkeydown="findKey(event)" oninput="findCount()">
</div><div class="rg-label">编辑</div></div>

</select>
<span class="item" id="st-page">—</span>
</div>
</div>
<script>
// ═══ 数据通道:generate_preview.aine 将 /*__JSON__*/{} 替换为核心渲染 JSON ═══
var DOC_DATA = /*__JSON__*/{};
var DEFAULT_SRC = '# Awen 迷你编辑器\n\n直接在纸面上打字,回车分段,选中文字用工具栏加粗、变色。\n\n## 断行规则\n\n中西文混排加八分之一 em 间距,英文单词不拆断,行首行尾禁则自动调整,连续标点挤压半宽。\n\n---\n\n> 引用示例\n\n- 列表项一\n- 列表项二\n\n@[table demo]\n| 列1 | 列2 |\n| --- | --- |\n| 内容 | 内容 |\n@[/table]\n';

// ═══ 页面模型(§30 A4)+ 断行度量(镜像 layout_width.aine)═══
var PAGE_W=210, PAGE_H=297, MARGIN=20;
var FONT_PT=11, PT2MM=0.352778;
var CHAR_MM=FONT_PT*PT2MM;
var CONTENT_W=PAGE_W-MARGIN*2, CONTENT_H=PAGE_H-MARGIN*2;
var MAX_EM=CONTENT_W/CHAR_MM;
var LINE_MM=FONT_PT*PT2MM*1.9;
var LINES_PER_PAGE=Math.floor(CONTENT_H/LINE_MM);

function isIdeo(c){return /[\u3400-\u4DBF\u4E00-\u9FFF]/.test(c)}
function isLatn(c){return /[A-Za-z0-9]/.test(c)}
function isCloseP(c){return /[。，、；？！」』）】》〉〕］｝]/.test(c)}
function isOpenP(c){return /[「『（《【〈〔［｛]/.test(c)}

function measureEm(text){
  var w=0, prev='';
  for(var i=0;i<text.length;i++){
    var c=text[i], cw;
    if(isIdeo(c))cw=1;
    else if(isCloseP(c))cw=(prev&&isCloseP(prev))?0.5:1;
    else if(isOpenP(c))cw=1;
    else if(isLatn(c))cw=0.5;
    else if(c===' ')cw=0.3;
    else cw=0.5;
    if(i>0&&((isIdeo(prev)||isCloseP(prev))&&isLatn(c)||(isLatn(prev)&&(isIdeo(c)||isCloseP(c)))))w+=0.125;
    w+=cw; prev=c;
  }
  return w;
}
function tokenize(text){
  var toks=[], cur='';
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(isLatn(c)){ cur+=c; continue }
    if(cur){ toks.push(cur); cur='' }
    toks.push(c);
  }
  if(cur)toks.push(cur);
  return toks;
}
// 贪心断行 + 禁则修正(镜像 layout_line_break;D-3 词边界)
function breakLines(text){
  var toks=tokenize(text), lines=[], cur='', curW=0;
  for(var i=0;i<toks.length;i++){
    var t=toks[i], tw=measureEm(t);
    var isClose=t.length===1&&isCloseP(t);
    var isOpen=t.length===1&&isOpenP(t);
    if(curW+tw<=MAX_EM||cur===''){ cur+=t; curW+=tw }
    else if(isClose){ cur+=t; lines.push(cur); cur=''; curW=0 }
    else if(isOpen&&cur.length>1){
      var last=cur.charAt(cur.length-1);
      lines.push(cur.slice(0,-1));
      cur=last+t; curW=measureEm(cur);
    }else{ lines.push(cur); cur=t; curW=tw }
  }
  if(cur)lines.push(cur);
  return lines.length?lines:[''];
}

// ═══ 行内工具 ═══
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function displayText(t){
  return t
    .replace(/@\[(u|color|size|font|mark)\s*[^\]]*\]((?:.|])*?)@\[\/\1\]/g,'$2')
    .replace(/\*\*((?:.|])*?)\*\*/g,'$1')
    .replace(/~~((?:.|])*?)~~/g,'$1')
    .replace(/`((?:.|])*?)`/g,'$1')
    .replace(/_((?:.|])*?)_/g,'$1');
}
function fmtH(t){
  var s=escHtml(t);
  s=s.replace(/@\[u\]((?:.|])*?)@\[\/u\]/g,'<u>$1</u>');
  s=s.replace(/@\[mark\s+([^\]]+)\]((?:.|])*?)@\[\/mark\]/g,'<span style="background:$1">$2</span>');
  s=s.replace(/@\[color\s+([^\]]+)\]((?:.|])*?)@\[\/color\]/g,'<span style="color:$1">$2</span>');
  s=s.replace(/@\[size\s+([^\]]+)\]((?:.|])*?)@\[\/size\]/g,'<span style="font-size:$1pt">$2</span>');
  s=s.replace(/@\[font\s+([^\]]+)\]((?:.|])*?)@\[\/font\]/g,function(m,f,inner){
    f=f.replace(/"/g,'');
    return'<span style="font-family:\''+f+'\',serif">'+inner+'</span>';
  });
  s=s.replace(/\*\*((?:.|])*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/~~((?:.|])*?)~~/g,'<del>$1</del>');
  s=s.replace(/`((?:.|])*?)`/g,'<code>$1</code>');
  s=s.replace(/_((?:.|])*?)_/g,'<em>$1</em>');
  return s;
}

// ═══ 块级解析(带源码行区间)═══
function miniParse(src){
  var lines=src.split('\n'), nodes=[], para=null;
  function flush(ei){ if(para){ para.srcEnd=ei; nodes.push(para); para=null } }
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(t===''){ flush(i); continue }
    if(/^#{1,6}\s/.test(t)){
      flush(i);
      nodes.push({kind:'heading',level:t.match(/^#+/)[0].length,text:t.replace(/^#+\s*/,''),srcStart:i,srcEnd:i+1});
      continue;
    }
    if(t==='---'){ flush(i); nodes.push({kind:'hr',text:'',srcStart:i,srcEnd:i+1}); continue }
    if(/^[-*] /.test(t)){ flush(i); nodes.push({kind:'ul',text:t.replace(/^[-*] /,''),srcStart:i,srcEnd:i+1}); continue }
    if(/^\d+\. /.test(t)){ flush(i); nodes.push({kind:'ol',text:t.replace(/^\d+\. /,''),srcStart:i,srcEnd:i+1}); continue }
    if(/^> /.test(t)){ flush(i); nodes.push({kind:'quote',text:t.replace(/^>\s*/,''),srcStart:i,srcEnd:i+1}); continue }
    if(t.charAt(0)==='|'&&t.charAt(t.length-1)==='|'){
      flush(i);
      var j=i, rows=[];
      while(j<lines.length&&lines[j].trim().charAt(0)==='|'){ rows.push(lines[j].trim()); j++ }
      nodes.push({kind:'table',rows:rows,srcStart:i,srcEnd:j});
      i=j-1; continue;
    }
    if(/^@\[comment/.test(t)){
      flush(i);
      var ci=i+1;
      if(t.indexOf('@[/comment]')<0){
        while(ci<lines.length&&lines[ci].indexOf('@[/comment]')<0)ci++;
        ci=Math.min(ci+1,lines.length);
      }
      nodes.push({kind:'comment',text:lines.slice(i,ci).join('\n'),srcStart:i,srcEnd:ci});
      i=ci-1; continue;
    }
    if(/^@\[(table|figure)\s/.test(t)||t==='@[table]'){
      flush(i);
      var fi=i+1;
      var closeTag='@[/'+t.match(/^@\[(\w+)/)[1]+']';
      if(t.indexOf(closeTag)<0){
        while(fi<lines.length&&lines[fi].indexOf(closeTag)<0)fi++;
        fi=Math.min(fi+1,lines.length);
      }
      if(/^@\[table/.test(t)){
        var trows=[];
        for(var ri=i+1;ri<fi-1;ri++){ if(lines[ri].trim().charAt(0)==='|')trows.push(lines[ri].trim()) }
        nodes.push({kind:'table',rows:trows,srcStart:i,srcEnd:fi});
      }else{
        nodes.push({kind:'obj',text:lines.slice(i,fi).join('\n'),srcStart:i,srcEnd:fi});
      }
      i=fi-1; continue;
    }
    if(/^@\[image/.test(t)){ flush(i); nodes.push({kind:'obj',text:t,srcStart:i,srcEnd:i+1}); continue }
    if(/^@\[(page|margin|font|size|line-spacing|first-line|theme|toc|numbering)\s/.test(t)){
      flush(i); nodes.push({kind:'docset',text:t,srcStart:i,srcEnd:i+1}); continue;
    }
    if(!para)para={kind:'para',text:'',srcStart:i};
    para.text=para.text?(para.text+' '+t):t;
  }
  flush(lines.length);
  return nodes;
}
function tableHtml(rows){
  function cells(r){return r.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim()})}
  var h='<table>';
  for(var i=0;i<rows.length;i++){
    var cs=cells(rows[i]);
    if(cs.every(function(c){return /^:?-{2,}:?$/.test(c)}))continue;
    h+='<tr>'+cs.map(function(c){return(i===0?'<th>':'<td>')+fmtH(c)+(i===0?'</th>':'</td>')}).join('')+'</tr>';
  }
  return h+'</table>';
}

// ═══ 排版分页(核心镜像)═══
function blockWeight(b){
  var n;
  if(b.kind==='hr')n=2;
  else if(b.kind==='docset')n=0.2;
  else if(b.kind==='comment')n=1;
  else if(b.kind==='heading')n=breakLines(displayText(b.text)).length+(b.level<=2?2:1.5);
  else if(b.kind==='table')n=b.rows.length+2;
  else if(b.kind==='obj')n=8;
  else if(b.kind==='ul'||b.kind==='ol')n=breakLines(displayText(b.text)).length+0.4;
  else if(b.kind==='quote')n=breakLines(displayText(b.text)).length+0.6;
  else n=breakLines(displayText(b.text)).length+0.3;
  return Math.max(n,0.5);
}
function layoutPages(blocks){
  var pages=[], cur=[], used=0, bid=0;
  for(var i=0;i<blocks.length;i++){
    var b=blocks[i]; b.bid=bid++;
    var w=blockWeight(b);
    if(used>0&&used+w>LINES_PER_PAGE&&w<=LINES_PER_PAGE){ pages.push(cur); cur=[]; used=0 }
    if(w>LINES_PER_PAGE&&b.kind==='para'){
      var lines=breakLines(displayText(b.text));
      var l0=0;
      while(l0<lines.length){
        var room=Math.floor(LINES_PER_PAGE-used);
        if(room<=0){ pages.push(cur); cur=[]; used=0; room=LINES_PER_PAGE }
        var take=Math.min(room,lines.length-l0);
        cur.push({b:b,l0:l0,l1:l0+take,partLines:lines});
        l0+=take; used+=take;
        if(used>=LINES_PER_PAGE&&l0<lines.length){ pages.push(cur); cur=[]; used=0 }
      }
      continue;
    }
    cur.push({b:b,whole:true});
    used+=w;
  }
  if(cur.length)pages.push(cur);
  return pages;
}

// ═══ 渲染:每张 A4 纸一个整体可编辑区(原生 Enter/Delete)═══
var gSrc='', gPages=[], gNodes=[];
function render(src){
  gSrc=src;
  gNodes=miniParse(src);
  gPages=layoutPages(gNodes);
  var pane=document.getElementById('display-pane');
  pane.innerHTML='';
  for(var p=0;p<gPages.length;p++){
    var sheet=document.createElement('div');
    sheet.className='sheet';
    var paper=document.createElement('div');
    paper.className='paper';
    paper.contentEditable='true';
    paper.dataset.page=p;
    for(var k=0;k<gPages[p].length;k++){
      var item=gPages[p][k], b=item.b;
      if(b.kind==='docset'){
        var d=document.createElement('div'); d.className='docset'; d.contentEditable='false'; d.textContent=b.text;
        paper.appendChild(d);
        paper.appendChild(gapEl()); continue;
      }
      if(b.kind==='comment'){
        var cm=document.createElement('div'); cm.className='comment-src'; cm.contentEditable='false';
        cm.textContent=b.text; cm.dataset.raw=b.text;
        paper.appendChild(cm);
        paper.appendChild(gapEl()); continue;
      }
      paper.appendChild(makeBlock(b,item));
      paper.appendChild(gapEl());
    }
    var folio=document.createElement('div');
    folio.className='folio'; folio.contentEditable='false'; folio.textContent='— '+(p+1)+' —';
    sheet.appendChild(paper); sheet.appendChild(folio);
    pane.appendChild(sheet);
  }
  renderOutline();
  renderStatus();
  var ta=document.getElementById('syntax-src');
  if(ta&&ta.value!==src)ta.value=src;
}
function gapEl(){ var g=document.createElement('div'); g.className='gap'; g.contentEditable='false'; return g }
function makeBlock(b,item){
  var html;
  if(item.whole||item.l0===undefined){
    html=blockHtml(b);
    var wrap=document.createElement('div');
    wrap.innerHTML=html;
    var inner=wrap.firstElementChild;
    inner.dataset.bid=b.bid;
    inner.dataset.kind=b.kind;
    if(b.kind==='obj')inner.dataset.raw=b.text;
    return inner;
  }
  var text=item.partLines.slice(item.l0,item.l1).join('');
  var el=document.createElement('p');
  el.dataset.bid=b.bid;
  el.dataset.kind='para';
  el.dataset.l0=item.l0; el.dataset.l1=item.l1;
  if(item.l0>0)el.style.textIndent='0';
  el.innerHTML=fmtH(text);
  return el;
}
function blockHtml(b){
  switch(b.kind){
    case 'heading':return'<h'+b.level+'>'+fmtH(b.text)+'</h'+b.level+'>';
    case 'hr':return'<hr>';
    case 'ul':return'<ul><li>'+fmtH(b.text)+'</li></ul>';
    case 'ol':return'<ol><li>'+fmtH(b.text)+'</li></ol>';
    case 'quote':return'<blockquote><p>'+fmtH(b.text)+'</p></blockquote>';
    case 'table':return tableHtml(b.rows);
    case 'obj':return'<div class="img-ph" contentEditable="false">'+escHtml(b.text.split('\n')[0])+'</div>';
    default:return'<p>'+fmtH(b.text)+'</p>';
  }
}
function renderOutline(){
  var ol=document.getElementById('outline');
  ol.innerHTML='';
  for(var i=0;i<gNodes.length;i++){
    var n=gNodes[i];
    if(n.kind!=='heading')continue;
    (function(n){
      var d=document.createElement('div');
      d.className='outline-item lv'+n.level;
      d.textContent=displayText(n.text);
      d.onclick=function(){
        var t=document.querySelector('#display-pane [data-bid="'+n.bid+'"]');
        if(t)t.scrollIntoView({behavior:'smooth',block:'start'});
      };
      ol.appendChild(d);
    })(n);
  }
}
function renderStatus(){
  var chars=0, labels=0;
  for(var i=0;i<gNodes.length;i++){
    if(gNodes[i].text)chars+=displayText(gNodes[i].text).replace(/\s/g,'').length;
    if(gNodes[i].text&&gNodes[i].text.indexOf('label')>=0)labels++;
  }
  document.getElementById('st-words').textContent=chars+' 字';
  document.getElementById('st-labels').textContent='Label '+labels;
  document.getElementById('st-page').textContent=gPages.length+' 页';
}

// ═══ DOM → 源码序列化(§85:纸面原生编辑,DOM 是输入,源码是权威)═══
function inlineSource(el){
  var out='';
  el.childNodes.forEach(function(n){
    if(n.nodeType===3){ out+=n.textContent; return }
    if(n.nodeType!==1)return;
    var tag=n.tagName, inner=inlineSource(n);
    if(tag==='STRONG'||tag==='B')out+='**'+inner+'**';
    else if(tag==='EM'||tag==='I')out+='_'+inner+'_';
    else if(tag==='DEL'||tag==='S'||tag==='STRIKE')out+='~~'+inner+'~~';
    else if(tag==='U')out+='@[u]'+inner+'@[/u]';
    else if(tag==='CODE')out+='`'+inner+'`';
    else if(tag==='SUP')out+='@[sup]'+inner+'@[/sup]';
    else if(tag==='SUB')out+='@[sub]'+inner+'@[/sub]';
    else if(tag==='FONT'){
      if(n.getAttribute('color'))out+='@[color '+n.getAttribute('color')+']'+inner+'@[/color]';
      else if(n.getAttribute('face'))out+='@[font "'+n.getAttribute('face')+'"]'+inner+'@[/font]';
      else if(n.getAttribute('size'))out+='@[size '+n.getAttribute('size')+']'+inner+'@[/size]';
      else out+=inner;
    }
    else if(tag==='SPAN'){
      if(n.dataset.cmd)out+=n.dataset.cmd+inner+(n.dataset.close||'');
      else out+=inner;
    }
    else if(tag==='BR')out+='\n';
    else out+=inner;
  });
  return out;
}
function blockPrefix(kind,level){
  if(kind==='heading')return'#'.repeat(level||1)+' ';
  if(kind==='ul')return'- ';
  if(kind==='ol')return'1. ';
  if(kind==='quote')return'> ';
  return'';
}
// 单个块元素 → 源码行数组(块内可能被浏览器塞进多个子块)
function serializeBlockEl(el){
  var kind=el.dataset.kind, lines=[];
  var kids=el.children;
  if(kind==='heading'&&/^H[1-6]$/.test(el.tagName)){
    lines.push('#'.repeat(+el.tagName.charAt(1))+' '+inlineSource(el).trim());
  }
  else if(kind==='hr'){
    lines.push('---');
  }
  else if(kind==='obj'&&el.dataset.raw){
    // 多行对象(figure 等)整段保真
    el.dataset.raw.split('\n').forEach(function(l){lines.push(l)});
  }
  else if(kind==='para'&&el.tagName==='P'){
    var t=inlineSource(el).replace(/\n+$/,'');
    lines.push(t);
  }
  else if(kind==='ul'||kind==='ol'){
    var items=el.querySelectorAll('li');
    if(items.length===0)items=[el];
    items.forEach(function(li){ lines.push(blockPrefix(kind)+inlineSource(li).trim()) });
  }
  else if(kind==='quote'){
    var qs=el.querySelectorAll('p,div');
    if(qs.length===0)qs=[el];
    qs.forEach(function(q){ lines.push('> '+inlineSource(q).trim()) });
  }
  else if(kind==='table'){
    var rows=[];
    el.querySelectorAll('tr').forEach(function(tr,idx){
      var cells=[];
      tr.querySelectorAll('th,td').forEach(function(c){cells.push(inlineSource(c).trim())});
      rows.push('| '+cells.join(' | ')+' |');
      if(idx===0)rows.push('| '+' --- |'.repeat(Math.max(cells.length,1)).trim());
    });
    lines.push('@[table demo]');
    rows.forEach(function(r){lines.push(r)});
    lines.push('@[/table]');
  }
  else{
    var t2=inlineSource(el).replace(/\n+$/,'');
    lines.push(t2);
  }
  return lines;
}
// 全文序列化:遍历每页纸的顶层块
function serializeAll(){
  var out=[];
  var papers=document.querySelectorAll('#display-pane .paper');
  papers.forEach(function(paper){
    var prevKind='';
    paper.childNodes.forEach(function(el){
      if(el.nodeType!==1)return;
      if(el.classList.contains('gap'))return;
      if(el.classList.contains('docset')){ out.push(el.textContent); prevKind='docset'; return }
      if(el.classList.contains('comment-src')){ out.push(el.dataset.raw||el.textContent); prevKind='comment'; return }
      // 原生 Enter 拆出的新块没有 data-bid,按通用规则识别类型
      var kind=el.dataset.kind||(/^H[1-6]$/.test(el.tagName)?'heading':el.tagName==='UL'?'ul':el.tagName==='OL'?'ol':el.tagName==='BLOCKQUOTE'?'quote':el.tagName==='TABLE'?'table':el.tagName==='HR'?'hr':'para');
      el.dataset.kind=kind;
      if(!el.dataset.bid){
        var maxBid=0;
        document.querySelectorAll('#display-pane [data-bid]').forEach(function(x){maxBid=Math.max(maxBid,+x.dataset.bid)});
        el.dataset.bid=maxBid+1;
      }
      var lines=serializeBlockEl(el);
      // 空行保真:除连续列表项外,顶层块之间保持空行(P-02)
      var isList=(kind==='ul'||kind==='ol');
      var prevIsList=(prevKind==='ul'||prevKind==='ol');
      if(out.length>0&&out[out.length-1].trim()!==''&&!(isList&&prevIsList))out.push('');
      lines.forEach(function(l){out.push(l)});
      prevKind=kind;
    });
  });
  // 还原表格之外的文本(表格行已直接以 @[table] 包装)
  return out.join('\n');
}

// ═══ 编辑同步:输入 → 序列化 → 必要时重排 ═══
var repagTimer=null;
function onPaperInput(){
  if(repagTimer)clearTimeout(repagTimer);
  repagTimer=setTimeout(function(){
    var newSrc=serializeAll();
    if(newSrc===gSrc)return;
    gSrc=newSrc;
    var ta=document.getElementById('syntax-src');
    if(ta)ta.value=gSrc;
    recordHist(gSrc,true);
    var caret=saveCaret();
    var before=gPages.length+'|'+gPages.map(function(p){return p.length?p[0].b.bid:-1}).join(',');
    gNodes=miniParse(gSrc);
    var sig=layoutPages(miniParse(gSrc));
    var after=sig.length+'|'+sig.map(function(p){return p.length?p[0].b.bid:-1}).join(',');
    if(before!==after){ render(gSrc); restoreCaret(caret) }
    else { renderOutline(); renderStatus() }
  },300);
}
function saveCaret(){
  var s=window.getSelection();
  if(!s.rangeCount)return null;
  var node=s.getRangeAt(0).startContainer;
  var blk=node.nodeType===1?(node.closest?node.closest('[data-bid]'):null):(node.parentElement&&node.parentElement.closest('[data-bid]'));
  if(!blk)return null;
  var r=s.getRangeAt(0).cloneRange();
  r.selectNodeContents(blk);
  r.setEnd(s.getRangeAt(0).endContainer,s.getRangeAt(0).endOffset);
  return{bid:blk.dataset.bid,off:r.toString().length};
}
function restoreCaret(c){
  if(!c)return;
  var el=document.querySelector('#display-pane [data-bid="'+c.bid+'"]');
  if(!el)return;
  var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT), n, left=c.off, last=null, first=null;
  while((n=walker.nextNode())){ if(first===null)first=n; if(n.length>=left){ setSel(n,left); focusPaper(el); return } left-=n.length; last=n }
  if(last){ setSel(last,last.length) } else if(first){ setSel(first,0) }
  focusPaper(el);
}
function setSel(node,off){
  var r=document.createRange(); r.setStart(node,off); r.collapse(true);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function focusPaper(el){
  var p=el.closest?el.closest('.paper'):null;
  if(p&&p.focus)p.focus({preventScroll:true});
}
// 跨页合并:Backspace 在页首块起点 / Delete 在页尾块终点
function onPaperKey(e){
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='b'){ e.preventDefault(); fmtCmd('bold'); return }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='i'){ e.preventDefault(); fmtCmd('italic'); return }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key==='u'){ e.preventDefault(); fmtCmd('underline'); return }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); doSave(); return }
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('table')){ e.preventDefault(); return }
  if(e.key==='Backspace'){
    var c=saveCaret();
    if(c&&c.off===0){
      var el=document.querySelector('#display-pane [data-bid="'+c.bid+'"]');
      var paper=el&&el.closest('.paper');
      if(paper){
        var first=paper.querySelector('[data-bid]');
        if(first===el&&+c.bid>0){
          var prev=nodeByBid(+c.bid-1);
          if(prev&&prev.kind!=='table'&&prev.kind!=='obj'){ e.preventDefault(); mergeBlocks(+c.bid-1,+c.bid) }
        }
      }
    }
  }
  else if(e.key==='Delete'){
    var c2=saveCaret();
    if(c2){
      var el2=document.querySelector('#display-pane [data-bid="'+c2.bid+'"]');
      var paper2=el2&&el2.closest('.paper');
      if(paper2){
        var blocks=paper2.querySelectorAll('[data-bid]');
        var lastEl=blocks[blocks.length-1];
        var len=textLen(lastEl);
        if(lastEl===el2&&c2.off>=len){
          var next=nodeByBid(+c2.bid+1);
          if(next&&next.kind!=='table'&&next.kind!=='obj'){ e.preventDefault(); mergeBlocks(+c2.bid,+c2.bid+1) }
        }
      }
    }
  }
}
function textLen(el){ return (el.textContent||'').length }
function nodeByBid(bid){
  for(var i=0;i<gNodes.length;i++){ if(gNodes[i].bid==bid)return gNodes[i] }
  return null;
}
function mergeBlocks(keepBid,goneBid){
  var keep=nodeByBid(keepBid), gone=nodeByBid(goneBid);
  if(!keep||!gone)return;
  var keepEl=document.querySelector('#display-pane [data-bid="'+keepBid+'"]');
  var goneEl=document.querySelector('#display-pane [data-bid="'+goneBid+'"]');
  var keepText=keepEl?inlineSource(keepEl).trim():displayText(keep.text);
  var goneText=goneEl?inlineSource(goneEl).trim():displayText(gone.text);
  var junction=keepText.length;
  var lines=gSrc.split('\n');
  var mergedLine=blockPrefix(keep.kind,keep.level)+(keepText+' '+goneText).replace(/\s+/g,' ').trim();
  lines.splice(keep.srcStart,gone.srcEnd-keep.srcStart,mergedLine);
  var caret={bid:keepBid,off:junction+1};
  render(lines.join('\n'));
  restoreCaret(caret);
  recordHist(gSrc,false);
}

// ═══ 工具栏命令 ═══
function inDisplayMode(){ return currentMode!=='syntax' }
function fmtCmd(cmd){
  if(inDisplayMode()){
    document.execCommand(cmd,false,null);
    onPaperInput();
  }else{
    var map={bold:['**','**'],italic:['_','_'],underline:['@[u]','@[/u]'],strikeThrough:['~~','~~']};
    if(map[cmd])wrapSyntax(map[cmd][0],map[cmd][1]);
  }
}
function fmtCmdInline(){
  if(inDisplayMode()){ document.execCommand('insertHTML',false,'<code>'+window.getSelection().toString()+'</code>'); onPaperInput() }
  else wrapSyntax('`','`');
}
function applyColor(v){
  if(inDisplayMode()){ document.execCommand('foreColor',false,v); onPaperInput() }
  else wrapSyntax('@[color '+v+']','@[/color]');
}
function applyMark(v){
  if(inDisplayMode()){
    var s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed)return;
    document.execCommand('insertHTML',false,'<span data-cmd="@[mark '+v+']" data-close="@[/mark]" style="background:'+v+'">'+s.toString()+'</span>');
    onPaperInput();
  }
  else wrapSyntax('@[mark '+v+']','@[/mark]');
}
function applySize(v){
  if(!v)return;
  if(inDisplayMode()){
    var s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed)return;
    document.execCommand('insertHTML',false,'<span data-cmd="@[size '+v+']" data-close="@[/size]" style="font-size:'+v+'pt">'+s.toString()+'</span>');
    onPaperInput();
  }
  else wrapSyntax('@[size '+v+']','@[/size]');
}
function applyFont(v){
  if(!v)return;
  if(inDisplayMode()){
    var s=window.getSelection();
    if(!s.rangeCount||s.isCollapsed)return;
    document.execCommand('insertHTML',false,'<span data-cmd=\'@[font "'+v+'"]\' data-close="@[/font]" style="font-family:\''+v+'\',serif">'+s.toString()+'</span>');
    onPaperInput();
  }
  else wrapSyntax('@[font "'+v+'"]','@[/font]');
  document.getElementById('sel-font').selectedIndex=0;
}
function applyStyle(lv){
  if(lv==='')return;
  var bel=caretBlock();
  var bid;
  if(bel)bid=+bel.dataset.bid;
  else{
    var ta=document.getElementById('syntax-src');
    if(!ta)return;
    var pos=ta.value.substring(0,ta.selectionStart).split('\n').length-1;
    for(var i=0;i<gNodes.length;i++){ if(pos>=gNodes[i].srcStart&&pos<gNodes[i].srcEnd){ bid=gNodes[i].bid; break } }
    if(bid===undefined)return;
  }
  var b=nodeByBid(bid);
  if(!b)return;
  var el=document.querySelector('#display-pane [data-bid="'+bid+'"]');
  var body=el?inlineSource(el).replace(/^#+\s*/,'').trim():displayText(b.text);
  var lines=gSrc.split('\n');
  lines.splice(b.srcStart,b.srcEnd-b.srcStart,'#'.repeat(+lv)+' '+body);
  setSrc(lines.join('\n'));
  restoreCaret({bid:bid,off:0});
}
function listCmd(kind){
  if(inDisplayMode()){
    document.execCommand(kind==='ul'?'insertUnorderedList':'insertOrderedList',false,null);
    onPaperInput();
  }else insertSyntax(kind==='ul'?'\n- 列表项\n':'\n1. 列表项\n');
}
function insertBlock(kind){
  var snippets={
    quote:['> 引用内容'],
    hr:['---'],
    link:['@[link 链接文字 url: https://example.com]'],
    image:['@[image 图片.png]'],
    table:['@[table demo]','| 列1 | 列2 |','| --- | --- |','| 内容 | 内容 |','@[/table]'],
    comment:['@[comment 批注内容,不参与渲染]'],
    footnote:['@[footnote 1 脚注内容]']
  };
  var ins=snippets[kind];
  if(inDisplayMode()){
    // 在当前块后插入新块
    var bel=caretBlock();
    var insertAt=gSrc.split('\n').length;
    if(bel){
      var b=nodeByBid(bel.dataset.bid);
      if(b)insertAt=b.srcEnd;
    }
    var lines=gSrc.split('\n');
    var insert=ins.slice();
    if(insertAt<lines.length&&lines[insertAt].trim()!=='')insert=insert.concat(['']);
    if(insertAt>0&&lines[insertAt-1].trim()!=='')insert=[''].concat(insert);
    lines.splice.apply(lines,[insertAt,0].concat(insert));
    setSrc(lines.join('\n'));
  }else insertSyntax('\n'+ins.join('\n')+'\n');
}
// 查找:高亮计数 + 跳转
function toggleFind(){
  var box=document.getElementById('findbox');
  box.style.display=box.style.display==='none'?'block':'none';
  if(box.style.display==='block')box.focus();
}
function findCount(){
  var q=document.getElementById('findbox').value;
  if(!q){ document.getElementById('st-find').textContent=''; return }
  var n=0, i=0, src=gSrc;
  while((i=src.indexOf(q,i))>=0){ n++; i+=q.length }
  document.getElementById('st-find').textContent='找到 '+n+' 处';
}
function findKey(e){
  if(e.key==='Enter'){
    e.preventDefault();
    var q=document.getElementById('findbox').value;
    if(q&&inDisplayMode()&&!window.find(q)){ findCount() }
  }
  if(e.key==='Escape')toggleFind();
}

// ═══ 语法视图(同一 A4 纸张几何)═══
function buildSyntaxPane(){
  if(document.getElementById('syntax-src'))return;
  var pane=document.getElementById('syntax-pane');
  var sheet=document.createElement('div');
  sheet.className='sheet';
  var src=document.createElement('div');
  src.className='src-paper';
  var ta=document.createElement('textarea');
  ta.id='syntax-src'; ta.spellcheck=false;
  ta.style.cssText='width:100%;height:'+(PAGE_H-2*MARGIN-2)+'mm;border:0;outline:0;resize:none;background:transparent;font:inherit;color:inherit;white-space:pre;overflow:auto';
  src.appendChild(ta);
  sheet.appendChild(src);
  pane.appendChild(sheet);
  ta.addEventListener('input',function(){
    recordHist(ta.value,true);
    if(repagTimer)clearTimeout(repagTimer);
    repagTimer=setTimeout(function(){ setSrc(ta.value) },250);
  });
}
function insertSyntax(text){
  var ta=document.getElementById('syntax-src');
  if(!ta)return;
  var s=ta.selectionStart;
  ta.value=ta.value.substring(0,s)+text+ta.value.substring(ta.selectionEnd);
  ta.selectionStart=ta.selectionEnd=s+text.length;
  ta.focus();
  setSrc(ta.value);
}
function wrapSyntax(open,close){
  var ta=document.getElementById('syntax-src');
  if(!ta)return;
  var s=ta.selectionStart,e=ta.selectionEnd;
  var sel=ta.value.substring(s,e)||'文本';
  ta.focus();
  ta.value=ta.value.substring(0,s)+open+sel+close+ta.value.substring(e);
  ta.selectionStart=s+open.length;
  ta.selectionEnd=s+open.length+sel.length;
  setSrc(ta.value);
}

// ═══ 撤销/重做 ═══
var hist=[],histIdx=-1,histTime=0;
function recordHist(text,merge){
  var now=Date.now();
  if(merge&&histIdx>=0&&now-histTime<500){ hist[histIdx]=text; histTime=now; return }
  hist=hist.slice(0,histIdx+1);
  hist.push(text);
  if(hist.length>300)hist.shift();
  histIdx=hist.length-1;
  histTime=now;
}
function doUndo(){
  if(histIdx<=0)return;
  histIdx--;
  applyHistory(hist[histIdx]);
}
function doRedo(){
  if(histIdx>=hist.length-1)return;
  histIdx++;
  applyHistory(hist[histIdx]);
}
function applyHistory(text){
  var caret=saveCaret();
  render(text);
  restoreCaret(caret);
  document.getElementById('st-diag').textContent='诊断 ✓ · 历史 '+histIdx+'/'+(hist.length-1);
}
function setSrc(s){
  var ta=document.getElementById('syntax-src');
  if(ta)ta.value=s;
  recordHist(s,false);
  render(s);
}

// ═══ 视图切换 ═══
var modeBtns=document.querySelectorAll('.view-tabs button');
var currentMode='display';
for(var i=0;i<modeBtns.length;i++){
  (function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})})(modeBtns[i]);
}
function setMode(mode){
  currentMode=mode;
  for(var i=0;i<modeBtns.length;i++)modeBtns[i].classList.toggle('active',modeBtns[i].dataset.mode===mode);
  var dp=document.getElementById('display-pane');
  var sp=document.getElementById('syntax-pane');
  buildSyntaxPane();
  if(mode==='syntax'){ dp.style.display='none'; dp.style.flex='none'; sp.style.display='flex'; sp.style.flex='1 1 auto' }
  else if(mode==='split'){ dp.style.display='flex'; dp.style.flex='1 1 50%'; sp.style.display='flex'; sp.style.flex='1 1 50%' }
  else{ dp.style.display='flex'; dp.style.flex='1 1 auto'; sp.style.display='none' }
  var ta=document.getElementById('syntax-src');
  if(ta)ta.value=gSrc;
  applyZoom(document.getElementById('sel-zoom').value);
}
function fitZoom(base){
  var v=parseFloat(base)||1;
  if(currentMode==='split'){
    var w=document.getElementById('display-pane').clientWidth;
    v*=Math.min(1,(w-48)/840);
  }
  return v;
}
function applyZoom(v){
  var z=fitZoom(v);
  document.getElementById('display-pane').style.zoom=z;
  document.getElementById('syntax-pane').style.zoom=z;
}
window.addEventListener('resize',function(){ applyZoom(document.getElementById('sel-zoom').value) });

document.getElementById('display-pane').addEventListener('input',onPaperInput);
document.getElementById('display-pane').addEventListener('keydown',onPaperKey);

function doSave(){
  var blob=new Blob([gSrc],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='document.awen.txt';
  a.click();
  document.getElementById('docname').textContent='未命名文档 · 已保存';
}
function caretBlock(){
  var s=window.getSelection();
  if(!s.rangeCount)return null;
  var node=s.getRangeAt(0).startContainer;
  return node.nodeType===1?(node.closest?node.closest('[data-bid]'):null):(node.parentElement&&node.parentElement.closest('[data-bid]'));
}

// ═══ 初始化 ═══
(function init(){
  var src=DEFAULT_SRC;
  if(DOC_DATA&&DOC_DATA.source)src=DOC_DATA.source;
  buildSyntaxPane();
  setSrc(src);
  // 序列化规范化一次(尾随换行等),消除首编辑差异
  var norm=serializeAll();
  if(norm!==src){ render(norm); recordHist(norm,false); }
  recordHist(gSrc,false);
})();
</script>
